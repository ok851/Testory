plugins {
    id 'com.android.application'
}

android {
    namespace 'com.testory.assistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.testory.assistant"
        minSdk 24
        targetSdk 34
        versionCode 15
        versionName "1.2.4"
        buildConfigField "int", "WS_PORT", "19223"
        buildConfigField "String", "WS_HOST", "\"127.0.0.1\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}

// Auto-copy APK to plugin_bundles after build (so PC install button uses latest)
task copyApkToBundles(type: Copy) {
    dependsOn 'assembleDebug'
    from "$buildDir/outputs/apk/debug/app-debug.apk"
    into "${rootProject.projectDir}/../config/plugin_bundles"
    rename { 'testory-assistant.apk' }
}
tasks.whenTaskAdded { task ->
    if (task.name == 'assembleDebug') {
        task.finalizedBy 'copyApkToBundles'
    }
}