plugins {
    id 'com.android.application'
}

android {
    namespace 'com.testory.assistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.testory.assistant"
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "1.1.8"
        buildConfigField "int", "WS_PORT", "19223"
        buildConfigField "String", "WS_HOST", "\"127.0.0.1\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
