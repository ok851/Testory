
# HuFirst UAT — Docker Compose
#
# 默认（仅 Web 自动化，适合 Linux/无桌面容器）:
#   docker compose up -d uat-platform
#
# 可选 AI 网关（保持独立 profile，按需启用）:
#   docker compose --profile with-embedded-browser up -d
#   docker compose --profile with-openclaw up -d
#   docker compose --profile full-stack up -d    # 平台 + 两个网关
#
# 反向代理 / PostgreSQL:
#   docker compose --profile with-nginx up -d
#   docker compose --profile with-postgres up -d
#
# 说明: 含桌面步骤的混排用例必须在 Windows 本机运行（见 docs/ARCHITECTURE_LOCAL.md）

services:
  uat-platform:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
      - ./videos:/app/videos
      - ./exports:/app/exports
      - ./license.key:/app/license.key:ro
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      - ALLOW_INSECURE_DEFAULT_ADMIN=${ALLOW_INSECURE_DEFAULT_ADMIN:-0}
      - FLASK_CORS_ORIGINS=${FLASK_CORS_ORIGINS:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-0}
      - TRUST_X_FORWARDED=${TRUST_X_FORWARDED:-0}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-50}
      - LOGIN_RATE_LIMIT_MAX=${LOGIN_RATE_LIMIT_MAX:-40}
      - LOGIN_RATE_LIMIT_WINDOW_SEC=${LOGIN_RATE_LIMIT_WINDOW_SEC:-900}
      - API_DETAILED_ERRORS=${API_DETAILED_ERRORS:-0}
      - AI_SELECTOR_FALLBACK=${AI_SELECTOR_FALLBACK:-1}
      - AI_SELECTOR_RECOVERY_MAX_NODES=${AI_SELECTOR_RECOVERY_MAX_NODES:-100}
      - DATABASE_PATH=/app/data/test_cases.db
      # Docker 部署：无桌面自动化
      - DEPLOYMENT_PROFILE=${DEPLOYMENT_PROFILE:-docker}
      - PLAYWRIGHT_HEADLESS=${PLAYWRIGHT_HEADLESS:-1}
      - PLAYWRIGHT_BROWSER=${PLAYWRIGHT_BROWSER:-chromium}
      # 未启用 embedded-browser-gateway profile 时，请在 .env 将 URL 置空或指向宿主机手动启动的网关
      - EMBEDDED_BROWSER_GATEWAY_URL=${EMBEDDED_BROWSER_GATEWAY_URL:-}
      - EMBEDDED_BROWSER_GATEWAY_SECRET=${EMBEDDED_BROWSER_GATEWAY_SECRET:-change-embedded-browser-secret}
      - EMBEDDED_BROWSER_PUBLIC_WS_BASE=${EMBEDDED_BROWSER_PUBLIC_WS_BASE:-ws://127.0.0.1:8765}
      - EMBEDDED_BROWSER_PUBLIC_CDP_HOST=${EMBEDDED_BROWSER_PUBLIC_CDP_HOST:-}
      # 未启用 openclaw-gateway profile 时，请在 .env 将 URL 置空或指向宿主机 Gateway
      - OPENCLAW_GATEWAY_URL=${OPENCLAW_GATEWAY_URL:-}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-change-openclaw-gateway-token}
      - OPENCLAW_GATEWAY_TIMEOUT=${OPENCLAW_GATEWAY_TIMEOUT:-120}
      - AI_LOCATOR_RESOLVE_ENABLE=${AI_LOCATOR_RESOLVE_ENABLE:-0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # 可选：OpenClaw Gateway（AI「优化」多轮工具 openclaw_execute）
  openclaw-gateway:
    profiles:
      - with-openclaw
      - full-stack
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    ports:
      - "${OPENCLAW_HOST_PORT:-18789}:18789"
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-change-openclaw-gateway-token}
      - OPENCLAW_SKIP_ONBOARDING=${OPENCLAW_SKIP_ONBOARDING:-1}
    volumes:
      - openclaw_config:/home/node/.openclaw
      - openclaw_workspace:/home/node/.openclaw/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 可选：内嵌 Chromium 网关（AI 测试 CDP / 画布 WS，与 Flask 进程隔离）
  embedded-browser-gateway:
    profiles:
      - with-embedded-browser
      - full-stack
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "embedded_browser_gateway"]
    ports:
      - "8765:8765"
    environment:
      - EMBEDDED_BROWSER_GATEWAY_SECRET=${EMBEDDED_BROWSER_GATEWAY_SECRET:-change-embedded-browser-secret}
      - EMBEDDED_BROWSER_GATE_LISTEN=0.0.0.0
      - EMBEDDED_BROWSER_GATE_PORT=8765
      - EMBEDDED_BROWSER_PUBLIC_CDP_HOST=${EMBEDDED_BROWSER_PUBLIC_CDP_HOST:-}
      - PLAYWRIGHT_HEADLESS=${PLAYWRIGHT_HEADLESS:-1}
      - PLAYWRIGHT_BROWSER=${PLAYWRIGHT_BROWSER:-chromium}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 35s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - uat-platform
    restart: unless-stopped
    profiles:
      - with-nginx

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=uat_platform
      - POSTGRES_USER=uat_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    profiles:
      - with-postgres

volumes:
  postgres_data:
  openclaw_config:
  openclaw_workspace:
