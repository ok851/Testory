name: Build & Test - Testory Assistant v2

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile_assistant_apk_v2/**'
  pull_request:
    branches: [main]
    paths:
      - 'mobile_assistant_apk_v2/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile_assistant_apk_v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: mobile_assistant_apk_v2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint check
        run: ./gradlew lint --no-daemon

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            mobile_assistant_apk_v2/**/build/reports/tests/
            mobile_assistant_apk_v2/**/build/reports/lint-results*.html

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: mobile_assistant_apk_v2/app/build/outputs/apk/debug/*.apk
