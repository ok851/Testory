<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; }
    h2 { font-size: 14px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
    .status { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 12px; }
    .status.on { background: rgba(16,185,129,0.1); color: #059669; }
    .status.off { background: rgba(107,114,128,0.1); color: #6b7280; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.on { background: #10b981; box-shadow: 0 0 6px rgba(16,185,129,0.5); }
    .dot.off { background: #94a3b8; }
    button { width: 100%; padding: 8px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
    .btn-start { background: #4f46e5; color: #fff; }
    .btn-stop { background: #ef4444; color: #fff; }
    .btn-start:hover { background: #4338ca; }
    .btn-stop:hover { background: #dc2626; }
    .info { font-size: 11px; color: #94a3b8; line-height: 1.5; margin-top: 8px; }
    .ws-url { font-size: 10px; color: #6b7280; word-break: break-all; padding: 6px 8px; background: #f3f4f6; border-radius: 4px; margin-top: 6px; max-height: 60px; overflow-y: auto; }
    label { font-size: 12px; color: #374151; display: block; margin-bottom: 4px; }
    input[type="number"] { width: 100%; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 12px; box-sizing: border-box; }
  </style>
</head>
<body>
  <h2>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    Testory CDP Bridge
  </h2>
  <div id="statusBar" class="status off">
    <span id="statusDot" class="dot off"></span>
    <span id="statusText">未连接</span>
  </div>
  <button id="toggleBtn" class="btn-start" onclick="toggleCDP()">启动 CDP 连接</button>
  <label>平台端口</label>
  <input type="number" id="portInput" value="5000" min="1024" max="65535" onchange="updatePort()">
  <div id="wsUrlBox" class="ws-url" style="display:none;"></div>
  <div class="info">
    点击按钮后，扩展将连接当前标签页的 CDP，并将 WebSocket URL 同步给 Testory 平台。Hermes 智能体即可通过 CDP 操作浏览器。
  </div>
  <script src="popup.js"></script>
</body>
</html>
