<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testory</title>
  <style>
    :root {
      --bg: #050816;
      --accent: #6366f1;
      --accent2: #06b6d4;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(circle at 20% 20%, rgba(99,102,241,.25), transparent 45%),
                        radial-gradient(circle at 80% 0%, rgba(6,182,212,.18), transparent 40%);
      color: var(--text);
      user-select: none;
      display: flex;
      flex-direction: column;
    }
    /* 窗口标题栏：与主背景连续，避免暗色凹陷条 */
    .titlebar {
      flex: 0 0 40px;
      height: 40px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0 0 0.85rem;
      background: transparent;
      border-bottom: none;
      box-shadow: none;
      color: #e2e8f0;
      user-select: none;
      z-index: 10000;
    }
    .titlebar__drag {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
      min-width: 0;
      -webkit-app-region: drag;
      app-region: drag;
      height: 100%;
    }
    .titlebar__mark {
      flex-shrink: 0;
      border-radius: 4px;
      width: 18px;
      height: 18px;
      opacity: 0.95;
    }
    .titlebar__title {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: rgba(226, 232, 240, 0.92);
    }
    .titlebar__controls {
      display: flex;
      align-items: stretch;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
      app-region: no-drag;
    }
    .titlebar__btn {
      width: 46px;
      height: 40px;
      border: 0;
      background: transparent;
      color: #94a3b8;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, color 0.15s ease;
      border-radius: 0;
      outline: none;
      -webkit-app-region: no-drag;
      app-region: no-drag;
    }
    .titlebar__btn svg {
      flex-shrink: 0;
      pointer-events: none;
    }
    .titlebar__btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
    }
    .titlebar__btn--close:hover {
      background: #e81123;
      color: #fff;
    }
    .titlebar__btn:active {
      opacity: 0.8;
    }
    /* 主内容区 */
    .wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      padding: 1rem;
    }
    .logo {
      width: 72px;
      height: 72px;
      filter: drop-shadow(0 12px 28px rgba(99, 102, 241, 0.35));
    }
    h1 {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      text-align: center;
      max-width: 28rem;
      line-height: 1.5;
    }
    .progress {
      width: min(240px, 70vw);
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.2);
      overflow: hidden;
      margin-top: 0.25rem;
    }
    .progress > span {
      display: block;
      height: 100%;
      width: 35%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <header class="titlebar" aria-label="窗口标题栏">
    <div class="titlebar__drag pywebview-drag-region">
      <img class="titlebar__mark" src="../brand/testory-mark.svg" alt="">
      <span class="titlebar__title">Testory</span>
    </div>
    <div class="titlebar__controls">
      <button type="button" class="titlebar__btn" data-win="minimize" title="最小化" aria-label="最小化">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect y="4.5" width="10" height="1" rx="0.5" fill="currentColor"/></svg>
      </button>
      <button type="button" class="titlebar__btn" data-win="maximize" title="最大化" aria-label="最大化">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="0.5" y="0.5" width="9" height="9" rx="1" stroke="currentColor"/></svg>
      </button>
      <button type="button" class="titlebar__btn titlebar__btn--close" data-win="close" title="关闭" aria-label="关闭">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>
  <div class="wrap pywebview-drag-region">
    <img class="logo" src="../brand/testory-mark.svg" alt="Testory" width="72" height="72">
    <h1>Testory</h1>
    <p id="status">正在启动本地服务…</p>
    <div class="progress" aria-hidden="true"><span></span></div>
  </div>
  <script>
    /* 窗口控制按钮 */
    (function () {
      function api() {
        return window.pywebview && window.pywebview.api;
      }
      document.querySelectorAll('[data-win]').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          var action = btn.getAttribute('data-win');
          var a = api();
          if (!a) return;
          if (action === 'minimize' && a.minimize) a.minimize();
          else if (action === 'maximize' && a.toggle_maximize) a.toggle_maximize();
          else if (action === 'close' && a.close) a.close();
        });
      });
      /* 标题栏双击最大化 */
      var drag = document.querySelector('.titlebar__drag');
      if (drag) {
        drag.addEventListener('dblclick', function (e) {
          if (e.target !== drag && e.target.tagName !== 'IMG' && e.target.tagName !== 'SPAN') return;
          var a = api();
          if (a && a.toggle_maximize) a.toggle_maximize();
        });
      }
    })();

    /* 启动状态轮询 */
    (function () {
      var el = document.getElementById('status');
      var port = 5000;
      function poll() {
        fetch('http://127.0.0.1:' + port + '/api/startup/status', { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (d && d.message) el.textContent = d.message;
          })
          .catch(function () {});
      }
      setInterval(poll, 450);
      poll();
    })();
  </script>
</body>
</html>
