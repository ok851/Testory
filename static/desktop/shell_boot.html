<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testory</title>
  <style>
    :root {
      --bg: #050816;
      --accent: #6366f1;
      --accent2: #06b6d4;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(99,102,241,.25), transparent 45%),
                  radial-gradient(circle at 80% 0%, rgba(6,182,212,.18), transparent 40%),
                  var(--bg);
      color: var(--text);
      user-select: none;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      padding: 1rem;
    }
    .logo {
      width: 72px;
      height: 72px;
      filter: drop-shadow(0 12px 28px rgba(99, 102, 241, 0.35));
    }
    h1 {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      text-align: center;
      max-width: 28rem;
      line-height: 1.5;
    }
    .progress {
      width: min(240px, 70vw);
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.2);
      overflow: hidden;
      margin-top: 0.25rem;
    }
    .progress > span {
      display: block;
      height: 100%;
      width: 35%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="../brand/testory-mark.svg" alt="Testory" width="72" height="72">
    <h1>Testory</h1>
    <p id="status">正在启动本地服务…</p>
    <div class="progress" aria-hidden="true"><span></span></div>
  </div>
  <script>
    (function () {
      var el = document.getElementById('status');
      var port = 5000;
      function poll() {
        fetch('http://127.0.0.1:' + port + '/api/startup/status', { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (d && d.message) el.textContent = d.message;
          })
          .catch(function () {});
      }
      setInterval(poll, 450);
      poll();
    })();
  </script>
</body>
</html>
