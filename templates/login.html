<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - UI自动化测试平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-500 to-purple-600 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 overflow-hidden">
        <div class="bg-gradient-to-r from-blue-500 to-purple-600 px-8 py-10 text-center text-white">
            <i class="fas fa-robot text-5xl mb-4"></i>
            <h1 class="text-2xl font-bold">UI自动化测试平台</h1>
            <p class="text-blue-100 mt-2 text-sm">请登录您的账户</p>
        </div>
        <div class="px-8 py-8">
            <div id="errorMsg" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-6 text-sm">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span id="errorText"></span>
            </div>
            <form id="loginForm">
                <div class="mb-5">
                    <label class="block text-gray-700 text-sm font-medium mb-2">用户名</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="username" name="username" required
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="请输入用户名" autocomplete="username">
                    </div>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-medium mb-2">密码</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="password" id="password" name="password" required
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="请输入密码" autocomplete="current-password">
                        <button type="button" onclick="togglePassword()"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i id="pwdIcon" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" id="submitBtn"
                    class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-3 rounded-lg font-medium hover:opacity-90 transition-opacity focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    <span id="btnText"><i class="fas fa-sign-in-alt mr-2"></i>登 录</span>
                </button>
            </form>
            <div class="mt-6 text-center text-sm text-gray-500">
                <p>默认管理员账号：<code class="bg-gray-100 px-1 rounded">admin</code> / <code class="bg-gray-100 px-1 rounded">admin123</code></p>
                <p class="mt-1 text-xs text-orange-500"><i class="fas fa-exclamation-triangle mr-1"></i>首次使用请及时修改密码</p>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('pwdIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');

            btn.disabled = true;
            btnText.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>登录中...';
            errorMsg.classList.add('hidden');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();
                if (data.success) {
                    // 保存用户信息到 localStorage
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    // 跳转到首页
                    const redirect = new URLSearchParams(window.location.search).get('next') || '/';
                    window.location.href = redirect;
                } else {
                    errorText.textContent = data.error || '登录失败，请重试';
                    errorMsg.classList.remove('hidden');
                    btn.disabled = false;
                    btnText.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>登 录';
                }
            } catch (err) {
                errorText.textContent = '网络错误，请检查连接';
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btnText.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>登 录';
            }
        });

        // 回车提交
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        });
    </script>
</body>
</html>
