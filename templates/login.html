{% extends "auth_shell.html" %}
{% block title %}登录 · {{ product_name }}{% endblock %}

{% block auth_content %}
<div class="testory-auth-card">
    <div class="testory-auth-card-header">
        <img src="{{ url_for('static', filename='brand/testory-mark.svg') }}" alt="{{ product_name }}" width="56" height="56" style="margin:0 auto">
        <h1>登录 {{ product_name }}</h1>
        <p class="sub">{% if is_local_standalone %}本机独立模式 · 数据保存在本机{% else %}连接团队服务器，开始自动化测试{% endif %}</p>
    </div>
    <div class="testory-auth-card-body">
        <div id="errorMsg" class="testory-auth-error">
            <span id="errorText"></span>
        </div>
        <form id="loginForm">
            <div class="testory-field" style="margin-bottom:1rem">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="testory-field" style="margin-bottom:1.25rem">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required placeholder="请输入密码" autocomplete="current-password">
            </div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:1rem;font-size:0.8rem;color:#94a3b8;">
                <label style="display:flex;align-items:center;gap:4px;cursor:pointer;">
                    <input type="checkbox" id="rememberMe" style="accent-color:#a5b4fc;">
                    记住登录状态
                </label>
                <select id="rememberDuration" style="padding:2px 6px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:#94a3b8;font-size:0.78rem;display:none;">
                    <option value="7">7 天</option>
                    <option value="30">30 天</option>
                    <option value="365">永久</option>
                </select>
            </div>
            <button type="submit" id="submitBtn" class="testory-btn-primary">
                <span id="btnText">登 录</span>
            </button>
        </form>
        <p style="margin-top:1.25rem;text-align:center;font-size:0.8rem;color:#64748b">
            没有账号？<a href="/register" style="color:#a5b4fc;text-decoration:none;font-weight:500;">立即注册</a>
            &nbsp;&nbsp;|&nbsp;&nbsp;
            <a href="/forgot-password" style="color:#a5b4fc;text-decoration:none;font-weight:500;">忘记密码？</a>
        </p>
    </div>
</div>
{% endblock %}

{% block auth_scripts %}
<script>
(function () {
    var params = new URLSearchParams(window.location.search);
    if (params.get('reason') === 'password_changed') {
        var errorMsg = document.getElementById('errorMsg');
        var errorText = document.getElementById('errorText');
        if (errorMsg && errorText) {
            errorText.textContent = '密码已更新，请使用新密码登录';
            errorMsg.classList.add('show');
            errorMsg.style.background = 'rgba(34, 197, 94, 0.12)';
            errorMsg.style.borderColor = 'rgba(34, 197, 94, 0.35)';
            errorMsg.style.color = '#86efac';
        }
    }
})();
document.getElementById('rememberMe').addEventListener('change', function() {
    document.getElementById('rememberDuration').style.display = this.checked ? 'inline' : 'none';
});
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const rememberMe = document.getElementById('rememberMe').checked;
    const rememberDuration = document.getElementById('rememberDuration').value;
    const btn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const errorMsg = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');

    btn.disabled = true;
    btnText.textContent = '登录中…';
    errorMsg.classList.remove('show');

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                username, password,
                remember_me: rememberMe,
                remember_duration: rememberMe ? parseInt(rememberDuration) : 0
            })
        });
        const data = await res.json();
        if (data.success) {
            localStorage.setItem('currentUser', JSON.stringify(data.user));
            const redirect = new URLSearchParams(window.location.search).get('next') || '/';
            window.location.href = redirect;
        } else {
            errorText.textContent = data.error || '登录失败，请重试';
            errorMsg.classList.add('show');
            btn.disabled = false;
            btnText.textContent = '登 录';
        }
    } catch (err) {
        errorText.textContent = '网络错误，请检查连接';
        errorMsg.classList.add('show');
        btn.disabled = false;
        btnText.textContent = '登 录';
    }
});
document.getElementById('password').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') document.getElementById('loginForm').dispatchEvent(new Event('submit'));
});
</script>
{% endblock %}
