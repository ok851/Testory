                } else {
                    indicator.style.bottom = '0px';
                    indicator.textContent = '▼ 松开可切换到下一页';
                }
                
                container.style.position = 'relative';
                container.appendChild(indicator);
            }
        }
        
        // 处理拖动过程中鼠标悬停
        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            
            const container = document.getElementById('stepsListContainer');
            const items = container.querySelectorAll('.step-item');
            const draggedItem = document.querySelector('.dragging');
            
            if (!draggedItem) return;
            
            // 计算鼠标位置
            const rect = container.getBoundingClientRect();
            const y = e.clientY - rect.top;
            
            // 找到当前鼠标位置对应的步骤
            let targetItem = null;
            for (let item of items) {
                if (item === draggedItem) continue;
                const itemRect = item.getBoundingClientRect();
                const itemTop = itemRect.top - rect.top;
                const itemBottom = itemTop + itemRect.height;
                
                if (y >= itemTop && y <= itemBottom) {
                    targetItem = item;
                    break;
                }
            }
            
            // 移除所有放置指示器
            items.forEach(item => {
                item.classList.remove('drag-over', 'drag-before', 'drag-after');
            });
            
            // 添加放置指示器
            if (targetItem) {
                const targetRect = targetItem.getBoundingClientRect();
                const targetTop = targetRect.top - rect.top;
                const targetMiddle = targetTop + targetRect.height / 2;
                
                if (y < targetMiddle) {
                    targetItem.classList.add('drag-before');
                } else {
                    targetItem.classList.add('drag-after');
                }
            }
        }
        
        // 处理拖放
        async function handleDrop(e) {
            e.preventDefault();
            
            const container = document.getElementById('stepsListContainer');
            const draggedItem = document.querySelector('.dragging');
            
            if (!draggedItem) return;
                        
            // 使用全局变量 draggedStepId
            draggedStepId = parseInt(draggedItem.getAttribute('data-step-id'));
                        
            // 重要：立即保存最终页面信息，因为后续操作可能会改变 currentPage
            const finalPage = currentPage;
            
            // 计算放置位置
            const rect = container.getBoundingClientRect();
            const y = e.clientY - rect.top;
            
            // 找到放置目标
            let targetItem = null;
            let insertPosition = 'end'; // 'before', 'after', 'start', 'end'
            
            const items = Array.from(container.querySelectorAll('.step-item'));
            const otherItems = items.filter(item => item !== draggedItem);
            
            // 简化的位置检测逻辑
            if (otherItems.length > 0) {
                if (y < 40) {
                    // 拖到了容器顶部
                    targetItem = otherItems[0];
                    insertPosition = 'start';
                } else if (y > rect.height - 40) {
                    // 拖到了容器底部
                    targetItem = otherItems[otherItems.length - 1];
                    insertPosition = 'end';
                } else {
                    // 寻找最合适的目标位置
                    for (let i = 0; i < otherItems.length; i++) {
                        const item = otherItems[i];
                        const itemRect = item.getBoundingClientRect();
                        const itemTop = itemRect.top - rect.top;
                        const itemBottom = itemTop + itemRect.height;
                        
                        if (y >= itemTop - 10 && y <= itemBottom + 10) {
                            targetItem = item;
                            const targetMiddle = itemTop + itemRect.height / 2;
                            insertPosition = y < targetMiddle ? 'before' : 'after';
                            break;
                        }
                    }
                }
            }
            
            console.log(`拖放操作: 步骤 ${draggedStepId}, 位置: ${insertPosition}, 目标页面: ${finalPage}`);
            
            // 执行DOM操作
            if (targetItem) {
                switch (insertPosition) {
                    case 'start':
                    case 'before':
                        container.insertBefore(draggedItem, targetItem);
                        break;
                    case 'after':
                        container.insertBefore(draggedItem, targetItem.nextSibling);
                        break;
                    case 'end':
                        container.appendChild(draggedItem);
                        break;
                }
            } else {
                container.appendChild(draggedItem);
            }
            
            // 计算新顺序并保存 - 使用保存的最终页面信息
            await updateStepOrderAfterDrop(draggedStepId, targetItem, insertPosition, finalPage);
            
            // 移除拖动状态
            draggedItem.classList.remove('dragging', 'cross-page-drag');
            items.forEach(item => {
                item.classList.remove('drag-over', 'drag-before', 'drag-after', 'cross-page-drag');
                // 清除内联样式
                item.style.cursor = '';
                item.style.transform = '';
                item.style.boxShadow = '';
                item.style.zIndex = '';
                item.style.position = '';
            });
            
            // 重置拖动状态
            if (pageSwitchTimer) {
                clearTimeout(pageSwitchTimer);
                pageSwitchTimer = null;
            }
            if (pageSwitchDebounceTimer) {
                clearTimeout(pageSwitchDebounceTimer);
                pageSwitchDebounceTimer = null;
            }
            
            draggedElement = null;
            draggedStepId = null;
            isDragging = false;
            
            // 移除拖动事件监听器
            document.removeEventListener('drag', handleDrag);
        }
        
        // 处理拖放后的步骤顺序更新 - 终极可靠版本
        async function updateStepOrderAfterDrop(draggedStepId, targetItem, insertPosition, targetPage) {
            try {
                // 确保目标页面有效
                if (targetPage === undefined || targetPage === null) {
                    targetPage = currentPage;
                }
                
                console.log(`===== 开始拖放保存流程 =====`);
                console.log(`步骤ID: ${draggedStepId}, 目标页: ${targetPage}, 位置: ${insertPosition}`);
                
                // 最简方案：直接使用当前DOM的顺序来更新整个页面
                const container = document.getElementById('stepsListContainer');
                const currentItems = container.querySelectorAll('.step-item');
                
                // 构建整个页面的步骤更新
                const pageStartOrder = (targetPage - 1) * pageSize + 1;
                const stepUpdates = [];
                
                console.log(`目标页起始顺序: ${pageStartOrder}`);
                
                currentItems.forEach((item, index) => {
                    const stepId = parseInt(item.getAttribute('data-step-id'));
                    const newOrder = pageStartOrder + index;
                    
                    stepUpdates.push({
                        id: stepId,
                        order: newOrder
                    });
                    
                    console.log(`步骤 ${stepId} -> 新顺序 ${newOrder}`);
                });
                
                // 如果目标页不是当前页，我们需要获取目标页的所有步骤
                if (targetPage !== currentPage) {
                    console.log(`目标页${targetPage}与当前页${currentPage}不同，需要特殊处理`);
                    
                    // 获取目标页当前的所有步骤
                    const targetPageResponse = await fetch(`/api/cases/${currentCaseId}/steps?page=${targetPage}&page_size=${pageSize}`);
                    const targetPageData = await targetPageResponse.json();
                    
                    // 将目标页现有步骤添加到更新列表
                    targetPageData.steps.forEach((step, index) => {
                        if (step.id !== draggedStepId) {  // 避免重复
                            stepUpdates.push({
                                id: step.id,
                                order: pageStartOrder + currentItems.length + index
                            });
                        }
                    });
                }
                
                console.log(`批量更新 ${stepUpdates.length} 个步骤...`);
                
                // 执行更新
                const response = await fetch(`/api/cases/${currentCaseId}/steps/order`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ steps: stepUpdates })
                });
                
                if (!response.ok) {
                    throw new Error(`更新失败: ${response.status}`);
                }
                
                const result = await response.json();
                if (!result.success) {
                    throw new Error(`更新失败: ${result.error || '未知错误'}`);
                }
                
                console.log('===== 保存成功 =====');
                
                // 更新当前页面并重新加载
                currentPage = targetPage;
                await loadSteps();
                
                console.log(`✓ 步骤已成功保存到页面 ${targetPage}`);
                
            } catch (error) {
                console.error('===== 保存失败 =====');
                console.error('错误:', error.message);
                console.error('堆栈:', error.stack);
                alert(`保存失败：${error.message}`);
            }
        }
                
        // 处理跨页拖动放置后的步骤顺序更新
        async function updateStepOrderAfterCrossPageDrop(draggedStepId, targetItem, insertPosition, targetPage) {
            try {
                console.log('===== 开始跨页拖动保存 =====');
                console.log(`步骤 ID: ${draggedStepId}, 目标页：${targetPage}, 位置：${insertPosition}`);
                        
                // 获取目标页的所有步骤
                const targetPageResponse = await fetch(`/api/cases/${currentCaseId}/steps?page=${targetPage}&page_size=${pageSize}`);
                
                if (!targetPageResponse.ok) {
                    throw new Error(`获取目标页步骤失败：HTTP ${targetPageResponse.status}`);
                }
                
                const targetPageData = await targetPageResponse.json();
                        
                if (!targetPageData.steps) {
                    throw new Error('获取目标页步骤失败：响应数据格式错误');
                }
                        
                // 获取被拖动步骤的当前信息
                const draggedStepResponse = await fetch(`/api/steps/${draggedStepId}`);
                
                if (!draggedStepResponse.ok) {
                    throw new Error(`获取被拖动步骤失败：HTTP ${draggedStepResponse.status}`);
                }
                
                const draggedStepData = await draggedStepResponse.json();
                        
                if (!draggedStepData.step) {
                    throw new Error('获取被拖动步骤失败：响应数据格式错误');
                }
                        
                const draggedStep = draggedStepData.step;
                const targetPageSteps = targetPageData.steps;
                        
                // 计算插入位置索引
                let insertIndex;
                switch (insertPosition) {
                    case 'start':
                        insertIndex = 0;
                        break;
                    case 'before':
                        insertIndex = targetPageSteps.findIndex(s => s.id == targetItem.getAttribute('data-step-id'));
                        break;
                    case 'after':
                        insertIndex = targetPageSteps.findIndex(s => s.id == targetItem.getAttribute('data-step-id')) + 1;
                        break;
                    case 'end':
                        insertIndex = targetPageSteps.length;
                        break;
                }
                        
                if (insertIndex === -1) insertIndex = targetPageSteps.length;
                        
                // 构建新的步骤顺序
                const newStepsOrder = [];
                        
                // 先添加目标页原有步骤（排除被拖动的那个，如果它在目标页）
                targetPageSteps.forEach(step => {
                    if (step.id !== draggedStepId) {
                        newStepsOrder.push(step);
                    }
                });
                        
                // 在指定位置插入被拖动的步骤
                newStepsOrder.splice(insertIndex, 0, draggedStep);
                        
                // 构建更新请求
                const stepUpdates = newStepsOrder.map((step, index) => {
                    return {
                        id: step.id,
                        order: (targetPage - 1) * pageSize + index + 1
                    };
                });
                        
                console.log(`批量更新 ${stepUpdates.length} 个步骤...`);
                        
                // 执行更新
                const response = await fetch(`/api/cases/${currentCaseId}/steps/order`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ steps: stepUpdates })
                });
                        
                if (!response.ok) {
                    throw new Error(`更新失败：${response.status}`);
                }
                        
                const result = await response.json();
                if (!result.success) {
                    throw new Error(`更新失败：${result.error || '未知错误'}`);
                }
                        
                console.log('✓ 保存成功');
                        
                // 重新加载目标页
                currentPage = targetPage;
                await loadSteps();
                        
            } catch (error) {
                console.error('===== 跨页拖动保存失败 =====');
                console.error('错误:', error.message);
                console.error('堆栈:', error.stack);
                        
                // 重新加载步骤以恢复原始顺序
                await loadSteps();
            }
        }
                
        // 清理拖动状态
        function cleanupDragState() {
            window.isCrossPageDrag = false;
            window.crossPageDragStepId = null;
                    
            const container = document.getElementById('stepsListContainer');
            if (container) {
                const items = container.querySelectorAll('.step-item');
                items.forEach(item => {
                    item.classList.remove('drag-over', 'drag-before', 'drag-after', 'cross-page-drag');
                    item.style.cursor = '';
                    item.style.transform = '';
                    item.style.boxShadow = '';
                    item.style.zIndex = '';
                    item.style.position = '';
                });
            }
                    
            isDragging = false;
            draggedElement = null;
            draggedStepId = null;
            isNearPageBoundary = false;
                    
            if (pageSwitchTimer) {
                clearTimeout(pageSwitchTimer);
                pageSwitchTimer = null;
            }
            if (pageSwitchDebounceTimer) {
                clearTimeout(pageSwitchDebounceTimer);
                pageSwitchDebounceTimer = null;
            }
            lastPageSwitchDirection = null;
                    
            document.removeEventListener('drag', handleDrag);
            console.log('拖动状态已清理');
        }
        
        // 更新步骤编号
        function updateStepNumbers() {
            const items = document.querySelectorAll('.step-item');
            items.forEach((item, index) => {
                const numberElement = item.querySelector('.step-number');
                if (numberElement) {
                    // 考虑分页因素计算实际步骤编号
                    const actualStepNumber = (currentPage - 1) * pageSize + index + 1;
                    numberElement.textContent = actualStepNumber;
                }
            });
        }
        
        // 保存步骤顺序
        async function saveStepOrder() {
            const container = document.getElementById('stepsListContainer');
            const items = container.querySelectorAll('.step-item');
            
            // 构建步骤顺序数组
            const stepOrder = Array.from(items).map((item, index) => {
                return {
                    id: parseInt(item.getAttribute('data-step-id')),
                    order: (currentPage - 1) * pageSize + index + 1
                };
            });
            
            try {
                const response = await fetch(`/api/cases/${currentCaseId}/steps/order`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ steps: stepOrder })
                });
                
                const data = await response.json();
                
                if (!data.success) {
                    console.error('保存步骤顺序失败:', data.error);
                    // 重新加载步骤以恢复原始顺序
                    loadSteps();
                }
            } catch (error) {
                console.error('保存步骤顺序时发生错误:', error);
                // 重新加载步骤以恢复原始顺序
                loadSteps();
            }
        }
        
        document.addEventListener('DOMContentLoaded', async function() {
            await loadCaseInfo();
            loadSteps();
            await syncRunCaseButtonState();
            runCaseButtonSyncTimer = setInterval(syncRunCaseButtonState, 1000);
        });

        async function syncRunCaseButtonState() {
            const stopBtn = document.getElementById('stopRunCaseBtn');
            if (!stopBtn) return;
            try {
                const resp = await fetch('/api/cases/current-run/status');
                const data = await resp.json();
                stopBtn.disabled = !(resp.ok && data.success && data.active);
            } catch (_) {
                stopBtn.disabled = true;
            }
        }
        
        // ==================== 步骤录制功能（V2） ====================
        const recorderState = {
            sessionId: null,
            pollingTimer: null,
            isRecording: false,
        };

        function setRecordingNotice(type, text) {
            const el = document.getElementById('recordingNotice');
            if (!el) return;
            if (!text) {
                el.style.display = 'none';
                el.textContent = '';
                return;
            }
            const map = {
                info: { bg: '#e7f3ff', color: '#155724', border: '#b8daff' },
                success: { bg: '#e8f8ee', color: '#155724', border: '#c3e6cb' },
                warning: { bg: '#fff3cd', color: '#856404', border: '#ffeeba' },
                error: { bg: '#f8d7da', color: '#721c24', border: '#f5c6cb' }
            };
            const style = map[type] || map.info;
            el.style.display = 'block';
            el.style.background = style.bg;
            el.style.color = style.color;
            el.style.border = `1px solid ${style.border}`;
            el.textContent = text;
        }
        
        // 显示录制模态框
        async function showRecordingModal() {
            document.getElementById('recordingModal').style.display = 'flex';
            await syncRecordingStatus();
        }
        
        function resetRecorderUi() {
            document.getElementById('startRecordBtn').style.display = 'inline-block';
            document.getElementById('stopRecordBtn').style.display = 'none';
            document.getElementById('recordingStatus').style.display = 'none';
        }

        function clearPolling() {
            if (recorderState.pollingTimer) {
                clearInterval(recorderState.pollingTimer);
                recorderState.pollingTimer = null;
            }
        }

        function resetRecordingPreview() {
            const container = document.getElementById('recordedStepsList');
            if (container) {
                container.innerHTML = `
                    <div style="text-align: center; color: #6c757d; padding: 40px;">
                        暂无录制步骤，点击上方"开始录制"按钮并在浏览器中操作
                    </div>
                `;
            }
            const cnt = document.getElementById('recordingStepCount');
            if (cnt) {
                cnt.textContent = '已录制 0 步';
            }
        }

        async function syncRecordingStatus() {
            try {
                const resp = await fetch('/api/recordings/status');
                const data = await resp.json();
                if (data.success && data.active) {
                    recorderState.isRecording = true;
                    recorderState.sessionId = data.session_id;
                    document.getElementById('startRecordBtn').style.display = 'none';
                    document.getElementById('stopRecordBtn').style.display = 'inline-block';
                    document.getElementById('recordingStatus').style.display = 'block';
                    document.getElementById('recordingStepCount').textContent = `已录制 ${data.total_steps || 0} 步`;
                    if (!recorderState.pollingTimer) {
                        recorderState.pollingTimer = setInterval(pollRecordingSteps, 1500);
                    }
                } else {
                    recorderState.isRecording = false;
                    recorderState.sessionId = null;
                    clearPolling();
                    resetRecorderUi();
                }
            } catch (_) {
                // ignore status sync errors
            }
        }

        // 关闭录制模态框
        async function closeRecordingModal() {
            if (recorderState.isRecording) {
                const shouldStop = confirm('当前正在录制，关闭窗口将先停止录制。是否继续？');
                if (!shouldStop) return;
                await stopRecording();
                if (recorderState.isRecording) {
                    recorderState.isRecording = false;
                    recorderState.sessionId = null;
                    clearPolling();
                    resetRecorderUi();
                }
            }
            document.getElementById('recordingModal').style.display = 'none';
        }
        
        // 开始录制
        async function startRecording() {
            const url = document.getElementById('recordingUrl').value.trim();
            if (recorderState.isRecording) {
                setRecordingNotice('warning', '已有录制会话在运行，请先停止后再开始。');
                return;
            }
            resetRecordingPreview();
            
            try {
                // 禁用开始按钮
                document.getElementById('startRecordBtn').disabled = true;
                setRecordingNotice('info', '正在启动录制浏览器，请稍候...');
                
                const response = await fetch('/api/recordings/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: url,
                        case_id: currentCaseId,
                        project_id: currentProjectId
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    clearPolling();
                    recorderState.sessionId = data.session_id;
                    recorderState.isRecording = true;
                    
                    // 更新 UI 状态
                    document.getElementById('startRecordBtn').style.display = 'none';
                    document.getElementById('stopRecordBtn').style.display = 'inline-block';
                    document.getElementById('recordingStatus').style.display = 'block';
                    
                    // 定时获取录制的步骤
                    recorderState.pollingTimer = setInterval(pollRecordingSteps, 1500);
                    const startMsg = data.navigated_url
                        ? `录制已开始，已导航到：${data.navigated_url}`
                        : '录制已开始，请在打开的浏览器中操作。';
                    setRecordingNotice('success', startMsg);
                } else {
                    throw new Error(data.error || '启动录制失败');
                }
            } catch (error) {
                console.error('启动录制失败:', error);
                setRecordingNotice('error', error.message || '启动录制失败，请稍后重试');
            } finally {
                document.getElementById('startRecordBtn').disabled = false;
            }
        }
        
        // 停止录制
        async function stopRecording() {
            try {
                const response = await fetch('/api/recordings/stop', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        session_id: recorderState.sessionId
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    recorderState.isRecording = false;
                    recorderState.sessionId = null;
                    clearPolling();
                    
                    resetRecorderUi();
                    
                    if (data.total_steps > 0) {
                        setRecordingNotice('success', `录制结束，已自动保存 ${data.saved_steps || data.total_steps} 个步骤。`);
                        loadSteps();
                    } else {
                        setRecordingNotice('warning', '录制结束，但未捕获到有效步骤。');
                    }
                } else {
                    throw new Error(data.error || '停止录制失败');
                }
            } catch (error) {
                console.error('停止录制失败:', error);
                recorderState.isRecording = false;
                recorderState.sessionId = null;
                clearPolling();
                resetRecorderUi();
                setRecordingNotice('warning', '录制会话已强制结束，请重新开始录制。');
            }
        }
        
        // 轮询获取录制步骤
        async function pollRecordingSteps() {
            if (!recorderState.sessionId || !recorderState.isRecording) {
                return;
            }
            
            try {
                const response = await fetch(`/api/recordings/steps?session_id=${recorderState.sessionId}`);
                const data = await response.json();
                
                if (data.success && data.active !== false) {
                    updateRecordingPreview(data.steps);
                    document.getElementById('recordingStepCount').textContent = `已录制 ${data.total_steps} 步`;
                } else {
                    recorderState.isRecording = false;
                    recorderState.sessionId = null;
                    clearPolling();
                    resetRecorderUi();
                    setRecordingNotice('info', '录制会话已结束。');
                }
            } catch (error) {
                console.error('获取录制步骤失败:', error);
            }
        }
        
        // 更新录制预览
        function updateRecordingPreview(steps) {
            const container = document.getElementById('recordedStepsList');
            
            if (steps.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; color: #6c757d; padding: 40px;">
                        暂无录制步骤，点击上方"开始录制"按钮并在浏览器中操作
                    </div>
                `;
                return;
            }
            
            let html = '';
            steps.forEach((step, index) => {
                // 兼容新旧两种录制格式
                const stepType = step.operation_type || step.action || 'click';
                const locatorValue = step.operation_locator || step.selector_value || '';
                const inputVal = (step.operation_value !== undefined && step.operation_value !== null)
                    ? step.operation_value
                    : (step.input_value || '');

                const icon = stepType === 'click' ? '👆' :
                            stepType === 'input' ? '✍️' :
                            stepType === 'hover' ? '👋' :
                            stepType === 'keypress' ? '⌨️' :
                            stepType === 'select' ? '🔽' :
                            stepType === 'navigate' ? '🔗' :
                            stepType === 'scroll' ? '📜' :
                            stepType === 'double_click' ? '👆👆' :
                            stepType === 'right_click' ? '🖱️' : '📋';
                
                html += `
                    <div style="padding: 12px; margin: 8px 0; background: #f8f9fa; border-radius: 6px; border-left: 4px solid #667eea;">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span style="font-size: 18px;">${icon}</span>
                            <strong style="color: #495057;">步骤 ${index + 1}:</strong>
                            <span style="color: #6c757d; font-size: 12px;">${step.description}</span>
                        </div>
                        <div style="margin-top: 8px; font-size: 12px; color: #6c757d;">
                            <strong>定位器:</strong> ${locatorValue}
                            ${inputVal ? `<br><strong>${stepType === 'keypress' ? '按键' : '值'}:</strong> ${inputVal}` : ''}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }
        
        // V3：停止后自动保存，移除手动保存/放弃入口
    </script>
</body>
