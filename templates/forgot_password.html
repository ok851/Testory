{% extends "auth_shell.html" %}
{% block title %}找回密码 · {{ product_name }}{% endblock %}

{% block auth_content %}
<div class="testory-auth-card">
    <div class="testory-auth-card-header">
        <img src="{{ url_for('static', filename='brand/testory-mark.svg') }}" alt="{{ product_name }}" width="56" height="56" style="margin:0 auto">
        <h1>找回密码</h1>
        <p class="sub">用注册时的找回密钥重置 · 无需邮箱</p>
    </div>
    <div class="testory-auth-card-body">
        <div id="errorMsg" class="testory-auth-error">
            <span id="errorText"></span>
        </div>
        <div id="successMsg" class="testory-auth-error" style="background:rgba(34,197,94,0.12);border-color:rgba(34,197,94,0.35);color:#86efac;display:none;">
            <span id="successText"></span>
        </div>

        <div id="resetPanel">
            <form id="resetForm">
                <div class="testory-field" style="margin-bottom:0.75rem">
                    <label for="username">用户名</label>
                    <input type="text" id="username" required placeholder="注册时的用户名" autocomplete="username">
                </div>
                <div class="testory-field" style="margin-bottom:0.75rem">
                    <label for="recoveryKey">找回密钥</label>
                    <input type="text" id="recoveryKey" required placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" style="font-family:ui-monospace,Consolas,monospace;letter-spacing:0.04em;">
                </div>
                <div class="testory-field" style="margin-bottom:0.75rem">
                    <label for="newPassword">新密码</label>
                    <input type="password" id="newPassword" required placeholder="至少6位" autocomplete="new-password">
                </div>
                <div class="testory-field" style="margin-bottom:1rem">
                    <label for="confirmPassword">确认新密码</label>
                    <input type="password" id="confirmPassword" required placeholder="再次输入新密码" autocomplete="new-password">
                </div>
                <button type="submit" id="resetBtn" class="testory-btn-primary">
                    <span id="resetBtnText">重置密码</span>
                </button>
            </form>
        </div>

        <div id="newKeyPanel" style="display:none;">
            <p style="margin:0 0 0.75rem;font-size:0.85rem;color:#cbd5e1;line-height:1.5;">密码已重置。系统已生成<strong style="color:#a5b4fc;">新的找回密钥</strong>（旧密钥已失效），请立即保存：</p>
            <div class="testory-field" style="margin-bottom:0.75rem">
                <label for="newRecoveryKey">新找回密钥</label>
                <input type="text" id="newRecoveryKey" readonly style="font-family:ui-monospace,Consolas,monospace;">
            </div>
            <button type="button" id="copyNewKeyBtn" class="testory-btn-primary" style="margin-bottom:0.75rem;">复制新密钥</button>
            <a href="/login?reason=password_changed" class="testory-btn-primary" style="display:block;text-align:center;text-decoration:none;background:rgba(165,180,252,0.15);color:#a5b4fc;border:1px solid rgba(165,180,252,0.3);">去登录</a>
        </div>

        <p style="margin-top:1.25rem;text-align:center;font-size:0.8rem;color:#64748b">
            <a href="/login" style="color:#a5b4fc;text-decoration:none;font-weight:500;">返回登录</a>
        </p>
    </div>
</div>
{% endblock %}

{% block auth_scripts %}
<script>
(function () {
    function showError(msg) {
        document.getElementById('errorText').textContent = msg;
        document.getElementById('errorMsg').classList.add('show');
        document.getElementById('successMsg').style.display = 'none';
    }

    document.getElementById('resetForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        var username = document.getElementById('username').value.trim();
        var recoveryKey = document.getElementById('recoveryKey').value.trim();
        var newPassword = document.getElementById('newPassword').value;
        var confirmPassword = document.getElementById('confirmPassword').value;
        var btn = document.getElementById('resetBtn');
        var btnText = document.getElementById('resetBtnText');
        document.getElementById('errorMsg').classList.remove('show');

        if (newPassword !== confirmPassword) {
            showError('两次输入的密码不一致');
            return;
        }

        btn.disabled = true;
        btnText.textContent = '重置中…';
        try {
            var res = await fetch('/api/auth/forgot-password/recovery-reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: username,
                    recovery_key: recoveryKey,
                    new_password: newPassword,
                    confirm_password: confirmPassword
                })
            });
            var data = {};
            try { data = await res.json(); } catch (parseErr) { data = {}; }
            if (!res.ok || !data.success) {
                var err = data.error || ('重置失败（HTTP ' + res.status + '）');
                if (res.status === 404) {
                    err = '找回接口不可用：请完全退出 Testory 后重新打开（需加载最新本地服务）';
                }
                showError(err);
                btn.disabled = false;
                btnText.textContent = '重置密码';
                return;
            }
            document.getElementById('resetPanel').style.display = 'none';
            document.getElementById('newKeyPanel').style.display = 'block';
            document.getElementById('newRecoveryKey').value = data.recovery_key || '';
        } catch (err) {
            showError('网络错误，请重试');
            btn.disabled = false;
            btnText.textContent = '重置密码';
        }
    });

    document.getElementById('copyNewKeyBtn').addEventListener('click', async function () {
        var key = document.getElementById('newRecoveryKey').value;
        try {
            await navigator.clipboard.writeText(key);
            this.textContent = '已复制';
        } catch (e) {
            document.getElementById('newRecoveryKey').select();
            document.execCommand('copy');
            this.textContent = '已复制';
        }
    });
})();
</script>
{% endblock %}
