{% extends "base.html" %}

{% block title %}通知配置 - UI自动化测试平台{% endblock %}

{% block content %}
<!-- 主内容 -->
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- 页面标题 -->
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900">
            <i class="fa-solid fa-bell text-blue-600 mr-2"></i>通知配置
        </h1>
        <p class="mt-2 text-gray-600">配置邮件、钉钉、企业微信、飞书等通知方式，及时获取测试执行结果</p>
    </div>

    <!-- 添加配置按钮 -->
    <div class="mb-6">
        <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center">
            <i class="fa-solid fa-plus mr-2"></i>添加通知配置
        </button>
    </div>

    <!-- 加载状态 -->
    <div id="loadingState" class="text-center py-12">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
        <p class="mt-2 text-gray-600">加载中...</p>
    </div>

    <!-- 配置列表 -->
    <div class="bg-white shadow rounded-lg overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="text-lg font-medium text-gray-900">通知配置列表</h2>
        </div>
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">名称</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">类型</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">通知事件</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">创建时间</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                    </tr>
                </thead>
                <tbody id="configList" class="bg-white divide-y divide-gray-200">
                    <!-- 配置列表将在这里动态生成 -->
                </tbody>
            </table>
        </div>
        <div id="emptyState" class="hidden py-12 text-center">
            <i class="fa-solid fa-bell-slash text-gray-300 text-5xl mb-4"></i>
            <p class="text-gray-500">暂无通知配置</p>
            <p class="text-gray-400 text-sm mt-1">点击上方按钮添加第一个通知配置</p>
        </div>
    </div>
</div>

<!-- 添加/编辑配置模态框 -->
<div id="configModal" class="hidden fixed inset-0 bg-gray-500 bg-opacity-75 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
        <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
            <h3 id="modalTitle" class="text-lg font-medium text-gray-900">添加通知配置</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-500">
                <i class="fa-solid fa-times text-xl"></i>
            </button>
        </div>
        <div class="px-6 py-4">
            <form id="configForm">
                <input type="hidden" id="configId">
                
                <!-- 配置名称 -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">配置名称 *</label>
                    <input type="text" id="configName" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="例如：钉钉测试群通知">
                </div>

                <!-- 通知类型 -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">通知类型 *</label>
                    <select id="configType" onchange="onTypeChange()" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">请选择通知类型</option>
                        <option value="email">邮件 (SMTP)</option>
                        <option value="dingtalk">钉钉机器人</option>
                        <option value="wechat">企业微信机器人</option>
                        <option value="feishu">飞书机器人</option>
                    </select>
                </div>

                <!-- 邮件配置 -->
                <div id="emailConfig" class="hidden space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">SMTP 服务器 *</label>
                        <input type="text" id="smtpServer"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="例如：smtp.qq.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">SMTP 端口 *</label>
                        <input type="number" id="smtpPort" value="587"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">发件人邮箱 *</label>
                        <input type="email" id="smtpUsername"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="例如：test@qq.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">邮箱密码/授权码 *</label>
                        <input type="password" id="smtpPassword"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="请输入邮箱密码或授权码">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">收件人邮箱 *</label>
                        <textarea id="toEmails" rows="2"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="多个邮箱用逗号分隔，例如：user1@qq.com, user2@qq.com"></textarea>
                    </div>
                </div>

                <!-- Webhook 配置 (钉钉/企微/飞书) -->
                <div id="webhookConfig" class="hidden space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Webhook 地址 *</label>
                        <input type="url" id="webhookUrl"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="https://...">
                        <p class="text-xs text-gray-500 mt-1">从钉钉/企微/飞书群机器人设置中复制 Webhook 地址</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">安全密钥 (可选)</label>
                        <input type="text" id="webhookSecret"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="如果启用了加签，请填写密钥">
                    </div>
                </div>

                <!-- 通知事件 -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">通知事件 *</label>
                    <div class="space-y-2">
                        <label class="flex items-center">
                            <input type="checkbox" name="events" value="schedule_success" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <span class="ml-2 text-sm text-gray-700">定时任务执行成功</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" name="events" value="schedule_failed" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <span class="ml-2 text-sm text-gray-700">定时任务执行失败</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" name="events" value="case_success" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <span class="ml-2 text-sm text-gray-700">测试用例执行成功</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" name="events" value="case_failed" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <span class="ml-2 text-sm text-gray-700">测试用例执行失败</span>
                        </label>
                    </div>
                </div>

                <!-- 启用状态 -->
                <div class="mb-4">
                    <label class="flex items-center">
                        <input type="checkbox" id="isActive" checked class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                        <span class="ml-2 text-sm font-medium text-gray-700">启用此通知配置</span>
                    </label>
                </div>
            </form>
        </div>
        <div class="px-6 py-4 border-t border-gray-200 flex justify-between">
            <button type="button" onclick="testNotification()" id="testBtn"
                class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg flex items-center">
                <i class="fa-solid fa-paper-plane mr-2"></i>发送测试
            </button>
            <div class="space-x-3">
                <button type="button" onclick="closeModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg">
                    取消
                </button>
                <button type="button" onclick="saveConfig()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">
                    保存
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 通知类型图标映射
    const typeIcons = {
        'email': '<i class="fa-solid fa-envelope text-blue-500"></i>',
        'dingtalk': '<i class="fa-brands fa-dingding text-blue-600"></i>',
        'wechat': '<i class="fa-brands fa-weixin text-green-500"></i>',
        'feishu': '<i class="fa-solid fa-paper-plane text-blue-400"></i>'
    };

    const typeNames = {
        'email': '邮件',
        'dingtalk': '钉钉',
        'wechat': '企业微信',
        'feishu': '飞书'
    };

    const eventNames = {
        'schedule_success': '任务成功',
        'schedule_failed': '任务失败',
        'case_success': '用例成功',
        'case_failed': '用例失败'
    };

    // 加载配置列表
    async function loadConfigs() {
        const loadingState = document.getElementById('loadingState');
        const tbody = document.getElementById('configList');
        const emptyState = document.getElementById('emptyState');
        
        try {
            // 显示加载状态
            if (loadingState) loadingState.classList.remove('hidden');
            
            const response = await fetch('/api/notifications/configs');
            const data = await response.json();
            
            // 隐藏加载状态
            if (loadingState) loadingState.classList.add('hidden');
            
            // 检查 API 返回是否成功
            if (!data.success) {
                console.error('加载配置列表失败:', data.error);
                Swal.fire('错误', data.error || '加载配置列表失败', 'error');
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            if (!data.configs || data.configs.length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            tbody.innerHTML = data.configs.map(config => `
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <span class="mr-2">${typeIcons[config.type] || ''}</span>
                            <span class="text-sm font-medium text-gray-900">${escapeHtml(config.name)}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="text-sm text-gray-600">${typeNames[config.type] || config.type}</span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex flex-wrap gap-1">
                            ${(config.events || []).map(e => `
                                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-800">
                                    ${eventNames[e] || e}
                                </span>
                            `).join('')}
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${config.is_active ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'}">
                            ${config.is_active ? '启用' : '禁用'}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${formatDate(config.created_at)}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="editConfig(${config.id})" class="text-blue-600 hover:text-blue-900 mr-3">
                            <i class="fa-solid fa-edit"></i> 编辑
                        </button>
                        <button onclick="deleteConfig(${config.id})" class="text-red-600 hover:text-red-900">
                            <i class="fa-solid fa-trash"></i> 删除
                        </button>
                    </td>
                </tr>
            `).join('');
        } catch (error) {
            console.error('加载配置列表失败:', error);
            if (loadingState) loadingState.classList.add('hidden');
            Swal.fire('错误', '加载配置列表失败', 'error');
        }
    }

    // 打开添加模态框
    function openAddModal() {
        document.getElementById('configForm').reset();
        document.getElementById('configId').value = '';
        document.getElementById('modalTitle').textContent = '添加通知配置';
        document.getElementById('testBtn').classList.remove('hidden');
        onTypeChange();
        document.getElementById('configModal').classList.remove('hidden');
    }

    // 打开编辑模态框
    async function editConfig(id) {
        try {
            const response = await fetch('/api/notifications/configs');
            const data = await response.json();
            const config = data.configs.find(c => c.id === id);
            
            if (!config) {
                Swal.fire('错误', '配置不存在', 'error');
                return;
            }

            document.getElementById('configId').value = config.id;
            document.getElementById('configName').value = config.name;
            document.getElementById('configType').value = config.type;
            document.getElementById('isActive').checked = config.is_active === 1;
            
            // 设置事件复选框
            document.querySelectorAll('input[name="events"]').forEach(cb => {
                cb.checked = (config.events || []).includes(cb.value);
            });

            // 设置配置详情
            onTypeChange();
            const cfg = config.config || {};
            if (config.type === 'email') {
                document.getElementById('smtpServer').value = cfg.smtp_server || '';
                document.getElementById('smtpPort').value = cfg.smtp_port || 587;
                document.getElementById('smtpUsername').value = cfg.username || '';
                document.getElementById('smtpPassword').value = cfg.password || '';
                document.getElementById('toEmails').value = (cfg.to_emails || []).join(', ');
            } else {
                document.getElementById('webhookUrl').value = cfg.webhook_url || '';
                document.getElementById('webhookSecret').value = cfg.secret || '';
            }

            document.getElementById('modalTitle').textContent = '编辑通知配置';
            document.getElementById('testBtn').classList.add('hidden');
            document.getElementById('configModal').classList.remove('hidden');
        } catch (error) {
            console.error('加载配置详情失败:', error);
            Swal.fire('错误', '加载配置详情失败', 'error');
        }
    }

    // 关闭模态框
    function closeModal() {
        document.getElementById('configModal').classList.add('hidden');
    }

    // 通知类型改变
    function onTypeChange() {
        const type = document.getElementById('configType').value;
        document.getElementById('emailConfig').classList.add('hidden');
        document.getElementById('webhookConfig').classList.add('hidden');
        
        if (type === 'email') {
            document.getElementById('emailConfig').classList.remove('hidden');
        } else if (['dingtalk', 'wechat', 'feishu'].includes(type)) {
            document.getElementById('webhookConfig').classList.remove('hidden');
        }
    }

    // 保存配置
    async function saveConfig() {
        const id = document.getElementById('configId').value;
        const name = document.getElementById('configName').value.trim();
        const type = document.getElementById('configType').value;
        const isActive = document.getElementById('isActive').checked ? 1 : 0;
        
        if (!name || !type) {
            Swal.fire('提示', '请填写必填项', 'warning');
            return;
        }

        // 获取选中的事件
        const events = Array.from(document.querySelectorAll('input[name="events"]:checked')).map(cb => cb.value);
        if (events.length === 0) {
            Swal.fire('提示', '请至少选择一个通知事件', 'warning');
            return;
        }

        // 构建配置对象
        let config = {};
        if (type === 'email') {
            const smtpServer = document.getElementById('smtpServer').value.trim();
            const smtpPort = parseInt(document.getElementById('smtpPort').value) || 587;
            const smtpUsername = document.getElementById('smtpUsername').value.trim();
            const smtpPassword = document.getElementById('smtpPassword').value;
            const toEmails = document.getElementById('toEmails').value.split(',').map(e => e.trim()).filter(e => e);
            
            if (!smtpServer || !smtpUsername || !smtpPassword || toEmails.length === 0) {
                Swal.fire('提示', '请填写完整的邮件配置', 'warning');
                return;
            }
            
            config = {
                smtp_server: smtpServer,
                smtp_port: smtpPort,
                username: smtpUsername,
                password: smtpPassword,
                to_emails: toEmails
            };
        } else {
            const webhookUrl = document.getElementById('webhookUrl').value.trim();
            const webhookSecret = document.getElementById('webhookSecret').value.trim();
            
            if (!webhookUrl) {
                Swal.fire('提示', '请填写 Webhook 地址', 'warning');
                return;
            }
            
            config = {
                webhook_url: webhookUrl,
                secret: webhookSecret || null
            };
        }

        const payload = {
            name,
            type,
            config,
            events,
            is_active: isActive
        };

        try {
            const url = id ? `/api/notifications/configs/${id}` : '/api/notifications/configs';
            const method = id ? 'PUT' : 'POST';
            
            const response = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const data = await response.json();
            
            if (data.success) {
                Swal.fire('成功', id ? '配置更新成功' : '配置创建成功', 'success');
                closeModal();
                loadConfigs();
            } else {
                Swal.fire('错误', data.error || '保存失败', 'error');
            }
        } catch (error) {
            console.error('保存配置失败:', error);
            Swal.fire('错误', '保存失败', 'error');
        }
    }

    // 删除配置
    async function deleteConfig(id) {
        const result = await Swal.fire({
            title: '确认删除?',
            text: '删除后无法恢复',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: '删除',
            cancelButtonText: '取消'
        });
        
        if (!result.isConfirmed) return;
        
        try {
            const response = await fetch(`/api/notifications/configs/${id}`, { method: 'DELETE' });
            const data = await response.json();
            
            if (data.success) {
                Swal.fire('成功', '配置已删除', 'success');
                loadConfigs();
            } else {
                Swal.fire('错误', data.error || '删除失败', 'error');
            }
        } catch (error) {
            console.error('删除配置失败:', error);
            Swal.fire('错误', '删除失败', 'error');
        }
    }

    // 测试通知
    async function testNotification() {
        const type = document.getElementById('configType').value;
        if (!type) {
            Swal.fire('提示', '请先选择通知类型', 'warning');
            return;
        }

        let config = {};
        if (type === 'email') {
            config = {
                type: 'email',
                smtp_server: document.getElementById('smtpServer').value.trim(),
                smtp_port: parseInt(document.getElementById('smtpPort').value) || 587,
                username: document.getElementById('smtpUsername').value.trim(),
                password: document.getElementById('smtpPassword').value,
                to_emails: document.getElementById('toEmails').value.split(',').map(e => e.trim()).filter(e => e)
            };
        } else {
            config = {
                type,
                webhook_url: document.getElementById('webhookUrl').value.trim(),
                secret: document.getElementById('webhookSecret').value.trim() || null
            };
        }

        try {
            const response = await fetch('/api/notifications/test', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ config })
            });
            
            const data = await response.json();
            
            if (data.success) {
                Swal.fire('成功', '测试通知已发送', 'success');
            } else {
                Swal.fire('失败', data.message || '发送失败', 'error');
            }
        } catch (error) {
            console.error('发送测试通知失败:', error);
            Swal.fire('错误', '发送失败', 'error');
        }
    }

    // HTML 转义
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // 格式化日期
    function formatDate(dateStr) {
        if (!dateStr) return '-';
        const date = new Date(dateStr);
        return date.toLocaleString('zh-CN');
    }

    // 初始化 - 并行加载数据以提高速度
    document.addEventListener('DOMContentLoaded', function() {
        // 加载配置列表（用户信息由 base.html 自动加载）
        loadConfigs();
    });
</script>
{% endblock %}
