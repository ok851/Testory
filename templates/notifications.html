{% extends "base.html" %}

{% block title %}通知配置 - AI自动化测试平台{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 text-gray-900 dark:text-gray-100">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900 dark:text-gray-100">
            <i class="fa-solid fa-bell text-blue-600 dark:text-blue-400 mr-2"></i><span data-i18n="ntf_h1">通知配置</span>
        </h1>
        <p class="mt-2 text-gray-600 dark:text-gray-400" data-i18n="ntf_sub">配置邮件、钉钉、企业微信、飞书等通知方式，及时获取测试执行结果</p>
    </div>
    <div class="mb-6">
        <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center shadow-sm dark:shadow-none">
            <i class="fa-solid fa-plus mr-2"></i><span data-i18n="ntf_add">添加通知配置</span>
        </button>
    </div>
    <div id="loadingState" class="text-center py-12">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
        <p class="mt-2 text-gray-600 dark:text-gray-400" data-i18n="ntf_loading">加载中...</p>
    </div>
    <div class="bg-white dark:bg-gray-900 shadow rounded-lg overflow-hidden border border-gray-200 dark:border-gray-800">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-800">
            <h2 class="text-lg font-medium text-gray-900 dark:text-gray-100" data-i18n="ntf_list">通知配置列表</h2>
        </div>
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-800">
                <thead class="bg-gray-50 dark:bg-gray-800">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider" data-i18n="ntf_th_name">名称</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider" data-i18n="ntf_th_type">类型</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider" data-i18n="ntf_th_ev">通知事件</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider" data-i18n="ntf_th_stat">状态</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider" data-i18n="ntf_th_time">创建时间</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider" data-i18n="ntf_th_act">操作</th>
                    </tr>
                </thead>
                <tbody id="configList" class="bg-white dark:bg-gray-900 divide-y divide-gray-200 dark:divide-gray-800">
                </tbody>
            </table>
        </div>
        <div id="emptyState" class="hidden py-12 text-center">
            <i class="fa-solid fa-bell-slash text-gray-300 dark:text-gray-600 text-5xl mb-4"></i>
            <p class="text-gray-500 dark:text-gray-400" data-i18n="ntf_empty1">暂无通知配置</p>
            <p class="text-gray-400 dark:text-gray-500 text-sm mt-1" data-i18n="ntf_empty2">点击上方按钮添加第一个通知配置</p>
        </div>
    </div>
</div>

<div id="configModal" class="hidden fixed inset-0 bg-gray-500 bg-opacity-75 dark:bg-gray-950 dark:bg-opacity-80 flex items-center justify-center z-50">
    <div class="bg-white dark:bg-gray-900 rounded-lg shadow-xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto border border-gray-200 dark:border-gray-800">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center">
            <h3 id="modalTitle" class="text-lg font-medium text-gray-900 dark:text-gray-100" data-i18n="ntf_modal_add">添加通知配置</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-500 dark:hover:text-gray-300">
                <i class="fa-solid fa-times text-xl"></i>
            </button>
        </div>
        <div class="px-6 py-4 text-gray-900 dark:text-gray-100">
            <form id="configForm">
                <input type="hidden" id="configId">
                
                <!-- 配置名称 -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="ntf_lbl_name">配置名称 *</label>
                    <input type="text" id="configName" required data-i18n-placeholder="ntf_ph_name"
                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100"
                        placeholder="例如：钉钉测试群通知">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="ntf_lbl_type">通知类型 *</label>
                    <select id="configType" onchange="onTypeChange()" required
                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100">
                        <option value="" data-i18n="ntf_opt_type">请选择通知类型</option>
                        <option value="email" data-i18n="ntf_type_email">邮件 (SMTP)</option>
                        <option value="dingtalk" data-i18n="ntf_type_ding">钉钉机器人</option>
                        <option value="wechat" data-i18n="ntf_type_wx">企业微信机器人</option>
                        <option value="feishu" data-i18n="ntf_type_fs">飞书机器人</option>
                    </select>
                </div>

                <!-- 邮件配置 -->
                <div id="emailConfig" class="hidden space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="ntf_smtp_host">SMTP 服务器 *</label>
                        <input type="text" id="smtpServer"
                            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100"
                            placeholder="例如：smtp.qq.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="ntf_smtp_port">SMTP 端口 *</label>
                        <input type="number" id="smtpPort" value="587"
                            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="ntf_smtp_from">发件人邮箱 *</label>
                        <input type="email" id="smtpUsername"
                            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100"
                            placeholder="例如：test@qq.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="ntf_smtp_pwd">邮箱密码/授权码 *</label>
                        <input type="password" id="smtpPassword"
                            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100"
                            placeholder="请输入邮箱密码或授权码">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="ntf_smtp_to">收件人邮箱 *</label>
                        <textarea id="toEmails" rows="2"
                            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100"
                            placeholder="多个邮箱用逗号分隔，例如：user1@qq.com, user2@qq.com"></textarea>
                    </div>
                </div>
                <div id="webhookConfig" class="hidden space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="ntf_wh">Webhook 地址 *</label>
                        <input type="url" id="webhookUrl"
                            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100"
                            placeholder="https://...">
                        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1" data-i18n="ntf_wh_hint">从钉钉/企微/飞书群机器人设置中复制 Webhook 地址</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="ntf_secret">安全密钥 (可选)</label>
                        <input type="text" id="webhookSecret" data-i18n-placeholder="ntf_secret_ph"
                            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100"
                            placeholder="如果启用了加签，请填写密钥">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" data-i18n="ntf_events">通知事件 *</label>
                    <div class="space-y-2">
                        <label class="flex items-center">
                            <input type="checkbox" name="events" value="schedule_success" class="rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500 bg-white dark:bg-gray-950">
                            <span class="ml-2 text-sm text-gray-700 dark:text-gray-300" data-i18n="ntf_ev_sch_ok">定时任务执行成功</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" name="events" value="schedule_failed" class="rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500 bg-white dark:bg-gray-950">
                            <span class="ml-2 text-sm text-gray-700 dark:text-gray-300" data-i18n="ntf_ev_sch_fail">定时任务执行失败</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" name="events" value="case_success" class="rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500 bg-white dark:bg-gray-950">
                            <span class="ml-2 text-sm text-gray-700 dark:text-gray-300" data-i18n="ntf_ev_case_ok">测试用例执行成功</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" name="events" value="case_failed" class="rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500 bg-white dark:bg-gray-950">
                            <span class="ml-2 text-sm text-gray-700 dark:text-gray-300" data-i18n="ntf_ev_case_fail">测试用例执行失败</span>
                        </label>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="flex items-center">
                        <input type="checkbox" id="isActive" checked class="rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500 bg-white dark:bg-gray-950">
                        <span class="ml-2 text-sm font-medium text-gray-700 dark:text-gray-300" data-i18n="ntf_enable">启用此通知配置</span>
                    </label>
                </div>
            </form>
        </div>
        <div class="px-6 py-4 border-t border-gray-200 dark:border-gray-800 flex justify-between bg-gray-50 dark:bg-gray-800/50">
            <button type="button" onclick="testNotification()" id="testBtn"
                class="bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 px-4 py-2 rounded-lg flex items-center">
                <i class="fa-solid fa-paper-plane mr-2"></i><span data-i18n="ntf_test">发送测试</span>
            </button>
            <div class="space-x-3">
                <button type="button" onclick="closeModal()" class="bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 px-4 py-2 rounded-lg" data-i18n="index_btn_cancel">取消</button>
                <button type="button" onclick="saveConfig()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg" data-i18n="steps_btn_save">保存</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 通知类型图标映射
    const typeIcons = {
        'email': '<i class="fa-solid fa-envelope text-blue-500"></i>',
        'dingtalk': '<i class="fa-brands fa-dingding text-blue-600"></i>',
        'wechat': '<i class="fa-brands fa-weixin text-green-500"></i>',
        'feishu': '<i class="fa-solid fa-paper-plane text-blue-400"></i>'
    };

    function ntfTypeName(ty) {
        return { email: t('ntf_type_email_s'), dingtalk: t('ntf_type_ding_s'), wechat: t('ntf_type_wx_s'), feishu: t('ntf_type_fs_s') }[ty] || ty;
    }
    function ntfEventName(ev) {
        return { schedule_success: t('ntf_ev_sch_ok_s'), schedule_failed: t('ntf_ev_sch_fail_s'), case_success: t('ntf_ev_case_ok_s'), case_failed: t('ntf_ev_case_fail_s') }[ev] || ev;
    }

    // 加载配置列表
    async function loadConfigs() {
        const loadingState = document.getElementById('loadingState');
        const tbody = document.getElementById('configList');
        const emptyState = document.getElementById('emptyState');
        
        try {
            // 显示加载状态
            if (loadingState) loadingState.classList.remove('hidden');
            
            const response = await fetch('/api/notifications/configs');
            const data = await response.json();
            
            // 隐藏加载状态
            if (loadingState) loadingState.classList.add('hidden');
            
            // 检查 API 返回是否成功
            if (!data.success) {
                console.error('加载配置列表失败:', data.error);
                Swal.fire(t('ntf_err'), data.error || t('ntf_load_fail'), 'error');
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            if (!data.configs || data.configs.length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            tbody.innerHTML = data.configs.map(config => `
                <tr class="dark:border-gray-800">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <span class="mr-2">${typeIcons[config.type] || ''}</span>
                            <span class="text-sm font-medium text-gray-900 dark:text-gray-100">${escapeHtml(config.name)}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="text-sm text-gray-600 dark:text-gray-400">${escapeHtml(ntfTypeName(config.type))}</span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex flex-wrap gap-1">
                            ${(config.events || []).map(e => `
                                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-100 dark:bg-blue-950 text-blue-800 dark:text-blue-300">
                                    ${escapeHtml(ntfEventName(e))}
                                </span>
                            `).join('')}
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${config.is_active ? 'bg-green-100 dark:bg-green-950 text-green-800 dark:text-green-300' : 'bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-300'}">
                            ${config.is_active ? escapeHtml(t('ntf_on')) : escapeHtml(t('ntf_off'))}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">
                        ${formatDate(config.created_at)}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="editConfig(${config.id})" class="text-blue-600 dark:text-blue-400 hover:text-blue-900 dark:hover:text-blue-300 mr-3">
                            <i class="fa-solid fa-edit"></i> ${escapeHtml(t('ntf_edit'))}
                        </button>
                        <button onclick="deleteConfig(${config.id})" class="text-red-600 dark:text-red-400 hover:text-red-900 dark:hover:text-red-300">
                            <i class="fa-solid fa-trash"></i> ${escapeHtml(t('ntf_del'))}
                        </button>
                    </td>
                </tr>
            `).join('');
        } catch (error) {
            console.error('加载配置列表失败:', error);
            if (loadingState) loadingState.classList.add('hidden');
            Swal.fire(t('ntf_err'), t('ntf_load_fail'), 'error');
        }
    }

    // 打开添加模态框
    function openAddModal() {
        document.getElementById('configForm').reset();
        document.getElementById('configId').value = '';
        document.getElementById('modalTitle').textContent = t('ntf_modal_add');
        document.getElementById('testBtn').classList.remove('hidden');
        onTypeChange();
        document.getElementById('configModal').classList.remove('hidden');
        if (typeof applyUiLang === 'function') applyUiLang();
    }

    // 打开编辑模态框
    async function editConfig(id) {
        try {
            const response = await fetch('/api/notifications/configs');
            const data = await response.json();
            const config = data.configs.find(c => c.id === id);
            
            if (!config) {
                Swal.fire(t('ntf_err'), t('ntf_nf'), 'error');
                return;
            }

            document.getElementById('configId').value = config.id;
            document.getElementById('configName').value = config.name;
            document.getElementById('configType').value = config.type;
            document.getElementById('isActive').checked = config.is_active === 1;
            
            // 设置事件复选框
            document.querySelectorAll('input[name="events"]').forEach(cb => {
                cb.checked = (config.events || []).includes(cb.value);
            });

            // 设置配置详情
            onTypeChange();
            const cfg = config.config || {};
            if (config.type === 'email') {
                document.getElementById('smtpServer').value = cfg.smtp_server || '';
                document.getElementById('smtpPort').value = cfg.smtp_port || 587;
                document.getElementById('smtpUsername').value = cfg.username || '';
                document.getElementById('smtpPassword').value = cfg.password || '';
                document.getElementById('toEmails').value = (cfg.to_emails || []).join(', ');
            } else {
                document.getElementById('webhookUrl').value = cfg.webhook_url || '';
                document.getElementById('webhookSecret').value = cfg.secret || '';
            }

            document.getElementById('modalTitle').textContent = t('ntf_modal_edit');
            document.getElementById('testBtn').classList.add('hidden');
            document.getElementById('configModal').classList.remove('hidden');
            if (typeof applyUiLang === 'function') applyUiLang();
        } catch (error) {
            console.error('加载配置详情失败:', error);
            Swal.fire(t('ntf_err'), t('ntf_detail_fail'), 'error');
        }
    }

    // 关闭模态框
    function closeModal() {
        document.getElementById('configModal').classList.add('hidden');
    }

    // 通知类型改变
    function onTypeChange() {
        const type = document.getElementById('configType').value;
        document.getElementById('emailConfig').classList.add('hidden');
        document.getElementById('webhookConfig').classList.add('hidden');
        
        if (type === 'email') {
            document.getElementById('emailConfig').classList.remove('hidden');
        } else if (['dingtalk', 'wechat', 'feishu'].includes(type)) {
            document.getElementById('webhookConfig').classList.remove('hidden');
        }
    }

    // 保存配置
    async function saveConfig() {
        const id = document.getElementById('configId').value;
        const name = document.getElementById('configName').value.trim();
        const type = document.getElementById('configType').value;
        const isActive = document.getElementById('isActive').checked ? 1 : 0;
        
        if (!name || !type) {
            Swal.fire(t('ntf_hint'), t('ntf_fill_req'), 'warning');
            return;
        }

        // 获取选中的事件
        const events = Array.from(document.querySelectorAll('input[name="events"]:checked')).map(cb => cb.value);
        if (events.length === 0) {
            Swal.fire(t('ntf_hint'), t('ntf_pick_ev'), 'warning');
            return;
        }

        // 构建配置对象
        let config = {};
        if (type === 'email') {
            const smtpServer = document.getElementById('smtpServer').value.trim();
            const smtpPort = parseInt(document.getElementById('smtpPort').value) || 587;
            const smtpUsername = document.getElementById('smtpUsername').value.trim();
            const smtpPassword = document.getElementById('smtpPassword').value;
            const toEmails = document.getElementById('toEmails').value.split(',').map(e => e.trim()).filter(e => e);
            
            if (!smtpServer || !smtpUsername || !smtpPassword || toEmails.length === 0) {
                Swal.fire(t('ntf_hint'), t('ntf_email_full'), 'warning');
                return;
            }
            
            config = {
                smtp_server: smtpServer,
                smtp_port: smtpPort,
                username: smtpUsername,
                password: smtpPassword,
                to_emails: toEmails
            };
        } else {
            const webhookUrl = document.getElementById('webhookUrl').value.trim();
            const webhookSecret = document.getElementById('webhookSecret').value.trim();
            
            if (!webhookUrl) {
                Swal.fire(t('ntf_hint'), t('ntf_wh_need'), 'warning');
                return;
            }
            
            config = {
                webhook_url: webhookUrl,
                secret: webhookSecret || null
            };
        }

        const payload = {
            name,
            type,
            config,
            events,
            is_active: isActive
        };

        try {
            const url = id ? `/api/notifications/configs/${id}` : '/api/notifications/configs';
            const method = id ? 'PUT' : 'POST';
            
            const response = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const data = await response.json();
            
            if (data.success) {
                Swal.fire(t('ntf_ok'), id ? t('ntf_save_ok_u') : t('ntf_save_ok_c'), 'success');
                closeModal();
                loadConfigs();
            } else {
                Swal.fire(t('ntf_err'), data.error || t('ntf_save_fail'), 'error');
            }
        } catch (error) {
            console.error('保存配置失败:', error);
            Swal.fire(t('ntf_err'), t('ntf_save_fail'), 'error');
        }
    }

    // 删除配置
    async function deleteConfig(id) {
        const result = await Swal.fire({
            title: t('ntf_del_title'),
            text: t('ntf_del_text'),
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: t('ntf_del_btn'),
            cancelButtonText: t('index_btn_cancel')
        });
        
        if (!result.isConfirmed) return;
        
        try {
            const response = await fetch(`/api/notifications/configs/${id}`, { method: 'DELETE' });
            const data = await response.json();
            
            if (data.success) {
                Swal.fire(t('ntf_ok'), t('ntf_del_ok'), 'success');
                loadConfigs();
            } else {
                Swal.fire(t('ntf_err'), data.error || t('ntf_del_fail_msg'), 'error');
            }
        } catch (error) {
            console.error('删除配置失败:', error);
            Swal.fire(t('ntf_err'), t('ntf_del_fail_msg'), 'error');
        }
    }

    // 测试通知
    async function testNotification() {
        const type = document.getElementById('configType').value;
        if (!type) {
            Swal.fire(t('ntf_hint'), t('ntf_pick_type'), 'warning');
            return;
        }

        let config = {};
        if (type === 'email') {
            config = {
                type: 'email',
                smtp_server: document.getElementById('smtpServer').value.trim(),
                smtp_port: parseInt(document.getElementById('smtpPort').value) || 587,
                username: document.getElementById('smtpUsername').value.trim(),
                password: document.getElementById('smtpPassword').value,
                to_emails: document.getElementById('toEmails').value.split(',').map(e => e.trim()).filter(e => e)
            };
        } else {
            config = {
                type,
                webhook_url: document.getElementById('webhookUrl').value.trim(),
                secret: document.getElementById('webhookSecret').value.trim() || null
            };
        }

        try {
            const response = await fetch('/api/notifications/test', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ config })
            });
            
            const data = await response.json();
            
            if (data.success) {
                Swal.fire(t('ntf_ok'), t('ntf_test_ok'), 'success');
            } else {
                Swal.fire(t('ntf_err'), data.message || t('ntf_test_fail'), 'error');
            }
        } catch (error) {
            console.error('发送测试通知失败:', error);
            Swal.fire(t('ntf_err'), t('ntf_test_fail'), 'error');
        }
    }

    // HTML 转义
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // 格式化日期
    function formatDate(dateStr) {
        if (!dateStr) return '-';
        const date = new Date(dateStr);
        var loc = (localStorage.getItem('ui_lang') || 'zh') === 'en' ? 'en-US' : 'zh-CN';
        return date.toLocaleString(loc, { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    document.addEventListener('DOMContentLoaded', function() {
        try { document.title = t('ntf_doc_title'); } catch (e) {}
        if (typeof applyUiLang === 'function') applyUiLang();
        loadConfigs();
    });
    window.addEventListener('ui-preferences-updated', function (ev) {
        if (ev.detail && ev.detail.source === 'load') return;
        try { document.title = t('ntf_doc_title'); } catch (e) {}
        if (typeof applyUiLang === 'function') applyUiLang();
        loadConfigs();
    });
</script>
{% endblock %}
