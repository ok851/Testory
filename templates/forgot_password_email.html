{% extends "auth_shell.html" %}
{% block title %}找回密码 · {{ product_name }}{% endblock %}

{% block auth_content %}
<div class="testory-auth-card">
    <div class="testory-auth-card-header">
        <img src="{{ url_for('static', filename='brand/testory-mark.svg') }}" alt="{{ product_name }}" width="56" height="56" style="margin:0 auto">
        <h1>找回密码</h1>
        <p class="sub">通过注册邮箱重置密码</p>
    </div>
    <div class="testory-auth-card-body">
        <div id="errorMsg" class="testory-auth-error">
            <span id="errorText"></span>
        </div>
        <div id="successMsg" class="testory-auth-error" style="background:rgba(34,197,94,0.12);border-color:rgba(34,197,94,0.35);color:#86efac;display:none;">
            <span id="successText"></span>
        </div>

        <!-- 步骤①：输入邮箱 -->
        <div id="stepEmail">
            <div class="testory-field" style="margin-bottom:1rem">
                <label for="email">注册邮箱</label>
                <input type="email" id="email" name="email" required placeholder="请输入注册时使用的邮箱">
            </div>
            <button type="button" id="sendCodeBtn" class="testory-btn-primary">
                发送验证码
            </button>
        </div>

        <!-- 步骤②：验证码 + 新密码 -->
        <div id="stepReset" style="display:none;">
            <div class="testory-field" style="margin-bottom:0.75rem">
                <label for="verifyCode">验证码</label>
                <input type="text" id="verifyCode" placeholder="6位验证码" maxlength="6">
            </div>
            <div class="testory-field" style="margin-bottom:0.75rem">
                <label for="newPassword">新密码</label>
                <input type="password" id="newPassword" placeholder="至少6位" autocomplete="new-password">
            </div>
            <div class="testory-field" style="margin-bottom:1rem">
                <label for="confirmPassword">确认新密码</label>
                <input type="password" id="confirmPassword" placeholder="再次输入新密码" autocomplete="new-password">
            </div>
            <button type="button" id="resetBtn" class="testory-btn-primary">
                <span id="resetBtnText">重置密码</span>
            </button>
            <p style="margin-top:0.75rem;text-align:center;font-size:0.78rem;color:#64748b;">
                <a href="#" id="resendLink" style="color:#a5b4fc;">重新发送验证码</a>
            </p>
        </div>

        <p style="margin-top:1.25rem;text-align:center;font-size:0.8rem;color:#64748b">
            <a href="/login" style="color:#a5b4fc;text-decoration:none;font-weight:500;">返回登录</a>
            &nbsp;·&nbsp;
            <a href="/forgot-password" style="color:#94a3b8;text-decoration:none;">密钥找回</a>
        </p>
    </div>
</div>
{% endblock %}

{% block auth_scripts %}
<script>
(function() {
    function showError(msg) {
        document.getElementById('errorText').textContent = msg;
        document.getElementById('errorMsg').classList.add('show');
        document.getElementById('successMsg').style.display = 'none';
    }

    function showSuccess(msg) {
        document.getElementById('successText').textContent = msg;
        document.getElementById('successMsg').style.display = 'block';
        document.getElementById('errorMsg').classList.remove('show');
    }

    document.getElementById('sendCodeBtn').addEventListener('click', async function() {
        var email = document.getElementById('email').value.trim();
        if (!email) { showError('请输入邮箱地址'); return; }

        var btn = document.getElementById('sendCodeBtn');
        btn.disabled = true;
        btn.textContent = '发送中…';
        document.getElementById('errorMsg').classList.remove('show');
        document.getElementById('successMsg').style.display = 'none';

        try {
            var res = await fetch('/api/auth/forgot-password/send-code', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: email})
            });
            var data = await res.json();
            if (data.success) {
                showSuccess(data.message || '若邮箱已注册，验证码已发送');
                document.getElementById('stepEmail').style.display = 'none';
                document.getElementById('stepReset').style.display = 'block';
                document.getElementById('verifyCode').focus();
            } else {
                showError(data.error || data.message || '发送失败');
            }
        } catch(e) {
            showError('网络错误');
        }
        btn.disabled = false;
        btn.textContent = '发送验证码';
    });

    document.getElementById('resendLink').addEventListener('click', function(e) {
        e.preventDefault();
        document.getElementById('stepReset').style.display = 'none';
        document.getElementById('stepEmail').style.display = 'block';
        document.getElementById('sendCodeBtn').click();
    });

    document.getElementById('resetBtn').addEventListener('click', async function() {
        var email = document.getElementById('email').value.trim();
        var code = document.getElementById('verifyCode').value.trim();
        var newPassword = document.getElementById('newPassword').value;
        var confirmPassword = document.getElementById('confirmPassword').value;

        if (!code) { showError('请输入验证码'); return; }
        if (!newPassword) { showError('请输入新密码'); return; }

        var btn = document.getElementById('resetBtn');
        var btnText = document.getElementById('resetBtnText');
        btn.disabled = true;
        btnText.textContent = '重置中…';
        document.getElementById('errorMsg').classList.remove('show');

        try {
            var res = await fetch('/api/auth/forgot-password/reset', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: email,
                    code: code,
                    new_password: newPassword,
                    confirm_password: confirmPassword
                })
            });
            var data = await res.json();
            if (data.success) {
                showSuccess('密码已重置，正在跳转到登录页…');
                setTimeout(function() {
                    window.location.href = '/login?reason=password_changed';
                }, 1500);
            } else {
                showError(data.error || data.message || '重置失败');
                btn.disabled = false;
                btnText.textContent = '重置密码';
            }
        } catch(e) {
            showError('网络错误');
            btn.disabled = false;
            btnText.textContent = '重置密码';
        }
    });

    document.getElementById('email').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') document.getElementById('sendCodeBtn').click();
    });
    document.getElementById('confirmPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') document.getElementById('resetBtn').click();
    });
})();
</script>
{% endblock %}
