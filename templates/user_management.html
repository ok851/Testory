{% extends "base.html" %}
{% block title %}用户管理 - AI自动化测试平台{% endblock %}
{% block head %}
    <style type="text/tailwindcss">
        @layer utilities {
            .btn { @apply px-4 py-2 rounded-lg font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 inline-flex items-center justify-center dark:focus:ring-offset-gray-900; }
            .btn-sm { @apply px-3 py-1.5 text-sm rounded-md; }
            .btn-primary { @apply bg-blue-600 text-white hover:bg-blue-700 focus:ring-blue-500 shadow-sm; }
            .btn-danger { @apply bg-red-600 text-white hover:bg-red-700 focus:ring-red-500 shadow-sm; }
            .btn-ghost { @apply bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-700 focus:ring-gray-500; }
            .card { @apply bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-gray-200 dark:border-gray-800 p-6; }
            .form-input { @apply w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100 text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent; }
            .form-label { @apply block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1; }
            .data-table { @apply min-w-full text-sm; }
            .data-table th { @apply px-4 py-3 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider bg-gray-50 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700; }
            .data-table td { @apply px-4 py-3 border-b border-gray-100 dark:border-gray-800 text-gray-800 dark:text-gray-200; }
            .badge { @apply px-2 py-0.5 rounded text-xs font-medium; }
            .badge-admin { @apply bg-red-100 dark:bg-red-900/40 text-red-800 dark:text-red-200; }
            .badge-tester { @apply bg-blue-100 dark:bg-blue-900/40 text-blue-800 dark:text-blue-200; }
            .badge-viewer { @apply bg-green-100 dark:bg-green-900/40 text-green-800 dark:text-green-200; }
            .um-modal { @apply hidden fixed inset-0 z-50 items-center justify-center bg-black/50 dark:bg-black/60 backdrop-blur-sm p-4; }
            .um-modal.flex { display: flex; }
            .um-modal-panel { @apply bg-white dark:bg-gray-900 rounded-xl shadow-xl border border-gray-200 dark:border-gray-800 w-full max-w-md max-h-[90vh] overflow-y-auto; }
        }
    </style>
{% endblock %}
{% block body_class %}bg-gray-50 dark:bg-gray-950 min-h-screen{% endblock %}
{% block content %}
    <div class="max-w-6xl mx-auto px-4 py-8">
        <div class="card">
            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-6">
                <h2 class="text-xl font-bold text-gray-900 dark:text-gray-100 flex items-center gap-2">
                    <i class="fas fa-users text-blue-600 dark:text-blue-400"></i>
                    <span data-i18n="um_h1">用户管理</span>
                </h2>
                <button type="button" class="btn btn-primary" onclick="showCreateModal()">
                    <i class="fas fa-plus mr-2"></i><span data-i18n="um_create">创建用户</span>
                </button>
            </div>
            <div class="overflow-x-auto rounded-lg border border-gray-200 dark:border-gray-800">
                <table id="userTable" class="data-table">
                    <thead>
                        <tr>
                            <th data-i18n="um_th_id">ID</th>
                            <th data-i18n="um_th_user">用户名</th>
                            <th data-i18n="um_th_email">邮箱</th>
                            <th data-i18n="um_th_role">角色</th>
                            <th data-i18n="um_th_stat">状态</th>
                            <th data-i18n="um_th_created">创建时间</th>
                            <th data-i18n="um_th_act">操作</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="createModal" class="um-modal">
        <div class="um-modal-panel p-6">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-gray-100 mb-4" data-i18n="um_modal_new">创建新用户</h3>
            <div class="space-y-4">
                <div>
                    <label class="form-label" data-i18n="um_lbl_user">用户名</label>
                    <input type="text" id="newUsername" class="form-input" data-i18n-placeholder="um_ph_user" placeholder="">
                </div>
                <div>
                    <label class="form-label" data-i18n="um_lbl_pass">密码</label>
                    <input type="password" id="newPassword" class="form-input" data-i18n-placeholder="um_ph_pass" placeholder="">
                </div>
                <div>
                    <label class="form-label" data-i18n="um_lbl_email">邮箱</label>
                    <input type="email" id="newEmail" class="form-input" data-i18n-placeholder="um_ph_email" placeholder="">
                </div>
                <div>
                    <label class="form-label" data-i18n="um_lbl_role">角色</label>
                    <select id="newRole" class="form-input">
                        <option value="tester" data-i18n-opt="um_role_tester">测试人员</option>
                        <option value="admin" data-i18n-opt="um_role_admin">管理员</option>
                        <option value="viewer" data-i18n-opt="um_role_viewer">只读用户</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button type="button" class="btn btn-ghost" onclick="closeModal('createModal')"><span data-i18n="index_btn_cancel">取消</span></button>
                <button type="button" class="btn btn-primary" onclick="createUser()"><span data-i18n="um_btn_create">创建</span></button>
            </div>
        </div>
    </div>

    <div id="editModal" class="um-modal">
        <div class="um-modal-panel p-6">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-gray-100 mb-4" data-i18n="um_modal_edit">编辑用户</h3>
            <input type="hidden" id="editUserId">
            <div class="space-y-4">
                <div>
                    <label class="form-label" data-i18n="um_lbl_user">用户名</label>
                    <input type="text" id="editUsername" class="form-input" data-i18n-placeholder="um_ph_user" placeholder="" autocomplete="username">
                </div>
                <div>
                    <label class="form-label" data-i18n="um_lbl_email">邮箱</label>
                    <input type="email" id="editEmail" class="form-input" data-i18n-placeholder="um_ph_email" placeholder="">
                </div>
                <div>
                    <label class="form-label" data-i18n="um_lbl_role">角色</label>
                    <select id="editRole" class="form-input">
                        <option value="tester" data-i18n-opt="um_role_tester">测试人员</option>
                        <option value="admin" data-i18n-opt="um_role_admin">管理员</option>
                        <option value="viewer" data-i18n-opt="um_role_viewer">只读用户</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button type="button" class="btn btn-ghost" onclick="closeModal('editModal')"><span data-i18n="index_btn_cancel">取消</span></button>
                <button type="button" class="btn btn-primary" onclick="updateUser()"><span data-i18n="um_btn_save">保存</span></button>
            </div>
        </div>
    </div>
{% endblock %}
{% block scripts %}
    <script>
        function umLocale() {
            try { return (localStorage.getItem('ui_lang') || 'zh') === 'en' ? 'en-US' : 'zh-CN'; } catch (e) { return 'zh-CN'; }
        }
        function umSub(str, map) {
            if (!str) return '';
            var s = str;
            if (map) for (var k in map) if (Object.prototype.hasOwnProperty.call(map, k)) s = s.split('{' + k + '}').join(map[k] == null ? '' : String(map[k]));
            return s;
        }
        function refreshUmSelectOptions() {
            document.querySelectorAll('[data-i18n-opt]').forEach(function (opt) {
                var k = opt.getAttribute('data-i18n-opt');
                if (k && typeof t === 'function') opt.textContent = t(k);
            });
        }

        async function loadUsers() {
            try {
                const res = await fetch('/api/users', { credentials: 'same-origin' });
                let data;
                try {
                    data = await res.json();
                } catch (je) {
                    console.error('加载用户: 响应非 JSON', je);
                    alert(typeof t === 'function' ? t('um_load_fail') : '');
                    return;
                }
                if (res.ok && data.success) {
                    renderUsers(data.users);
                } else {
                    alert((typeof t === 'function' ? t('um_load_fail') : '') + ': ' + (data.error || (typeof t === 'function' ? t('um_err_unknown') : '')));
                }
            } catch (e) {
                console.error('加载用户失败:', e);
                alert(typeof t === 'function' ? t('um_load_fail') : '');
            }
        }

        function roleName(role) {
            var k = role === 'admin' ? 'um_role_admin' : (role === 'viewer' ? 'um_role_viewer' : 'um_role_tester');
            return typeof t === 'function' ? t(k) : role;
        }

        /** HTML 文本转义（表格单元格） */
        function umEscHtml(s) {
            return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }
        /** 属性值转义（用于 data-*，避免引号破坏 DOM） */
        function umEscAttr(s) {
            return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
        }

        function renderUsers(users) {
            const tbody = document.getElementById('userTableBody');
            const on = typeof t === 'function' ? t('um_st_on') : '';
            const off = typeof t === 'function' ? t('um_st_off') : '';
            const bEdit = typeof t === 'function' ? t('um_btn_edit') : '';
            const bDel = typeof t === 'function' ? t('um_btn_del') : '';
            tbody.innerHTML = users.map(u => {
                return (
                    '<tr class="hover:bg-gray-50 dark:hover:bg-gray-800/50">' +
                    '<td>' + u.id + '</td>' +
                    '<td class="font-medium">' + umEscHtml(u.username) + '</td>' +
                    '<td>' + umEscHtml(u.email || '-') + '</td>' +
                    '<td><span class="badge badge-' + umEscHtml(u.role) + '">' + roleName(u.role) + '</span></td>' +
                    '<td>' + (u.is_active ? '<span class="text-green-600 dark:text-green-400">' + on + '</span>' : '<span class="text-gray-500 dark:text-gray-400">' + off + '</span>') + '</td>' +
                    '<td class="text-gray-600 dark:text-gray-400">' + new Date(u.created_at).toLocaleString(umLocale(), { timeZone: 'Asia/Shanghai' }) + '</td>' +
                    '<td><button type="button" class="btn btn-sm btn-primary um-open-edit" data-user-id="' + u.id + '" data-username="' + umEscAttr(u.username) + '" data-email="' + umEscAttr(u.email || '') + '" data-role="' + umEscAttr(u.role) + '"><i class="fas fa-edit mr-1"></i>' + bEdit + '</button> ' +
                    '<button type="button" class="btn btn-sm btn-danger um-open-del" data-user-id="' + u.id + '" data-username="' + umEscAttr(u.username) + '"><i class="fas fa-trash mr-1"></i>' + bDel + '</button></td>' +
                    '</tr>'
                );
            }).join('');
        }

        function showCreateModal() {
            refreshUmSelectOptions();
            document.getElementById('createModal').classList.add('flex');
        }

        function showEditModal(id, username, email, role) {
            refreshUmSelectOptions();
            document.getElementById('editUserId').value = id;
            document.getElementById('editUsername').value = username || '';
            document.getElementById('editEmail').value = email || '';
            document.getElementById('editRole').value = role;
            document.getElementById('editModal').classList.add('flex');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('flex');
        }

        async function createUser() {
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value;
            const email = document.getElementById('newEmail').value.trim();
            const role = document.getElementById('newRole').value;

            if (!username || !password) {
                alert(typeof t === 'function' ? t('um_need_auth') : '');
                return;
            }

            try {
                const res = await fetch('/api/users', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, email, role })
                });
                let data;
                try {
                    data = await res.json();
                } catch (je) {
                    console.error('创建用户: 响应非 JSON', je);
                    alert(typeof t === 'function' ? t('um_net_create') : '');
                    return;
                }
                if (res.ok && data.success) {
                    alert(typeof t === 'function' ? t('um_create_ok') : '');
                    closeModal('createModal');
                    loadUsers();
                    document.getElementById('newUsername').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('newEmail').value = '';
                } else {
                    alert((typeof t === 'function' ? t('um_create_fail') : '') + ': ' + (data.error || (typeof t === 'function' ? t('um_err_unknown') : '')));
                }
            } catch (e) {
                console.error('创建用户失败:', e);
                alert(typeof t === 'function' ? t('um_net_create') : '');
            }
        }

        /** 用户更新/删除：优先走标准 REST（PUT/DELETE），与旧部署兼容；404/405 时再试 POST 别名（新代码 + 部分代理环境）。 */
        async function umFetchJson(url, options) {
            const res = await fetch(url, Object.assign({ credentials: 'same-origin' }, options || {}));
            const text = await res.text();
            let data = null;
            if (text) {
                try {
                    data = JSON.parse(text);
                } catch (je) {
                    console.error('用户管理接口返回非 JSON', url, res.status, text.slice(0, 300));
                }
            }
            return { res, data };
        }

        async function umUserUpdate(id, body) {
            let out = await umFetchJson('/api/users/' + id, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (out.res.status === 404 || out.res.status === 405) {
                out = await umFetchJson('/api/users/' + id + '/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
            }
            return out;
        }

        async function umUserDelete(id) {
            let out = await umFetchJson('/api/users/' + id, { method: 'DELETE' });
            if (out.res.status === 404 || out.res.status === 405) {
                out = await umFetchJson('/api/users/' + id + '/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: '{}'
                });
            }
            return out;
        }

        async function updateUser() {
            const id = document.getElementById('editUserId').value;
            const username = document.getElementById('editUsername').value.trim();
            const email = document.getElementById('editEmail').value.trim();
            const role = document.getElementById('editRole').value;

            if (!username) {
                alert(typeof t === 'function' ? t('um_need_username') : '');
                return;
            }

            const body = { username, email, role };

            try {
                const { res, data } = await umUserUpdate(id, body);
                if (!data) {
                    alert(typeof t === 'function' ? t('um_net_update') : '');
                    return;
                }
                if (res.ok && data.success) {
                    alert(typeof t === 'function' ? t('um_update_ok') : '');
                    closeModal('editModal');
                    loadUsers();
                } else {
                    alert((typeof t === 'function' ? t('um_update_fail') : '') + ': ' + (data.error || (typeof t === 'function' ? t('um_err_unknown') : '')));
                }
            } catch (e) {
                console.error('更新用户失败:', e);
                alert(typeof t === 'function' ? t('um_net_update') : '');
            }
        }

        async function deleteUser(id, username) {
            if (!confirm(typeof t === 'function' ? umSub(t('um_del_confirm'), { name: username }) : '')) return;

            try {
                const { res, data } = await umUserDelete(id);
                if (!data) {
                    alert(typeof t === 'function' ? t('um_net_del') : '');
                    return;
                }
                if (res.ok && data.success) {
                    alert(typeof t === 'function' ? t('um_del_ok') : '');
                    loadUsers();
                } else {
                    alert((typeof t === 'function' ? t('um_del_fail') : '') + ': ' + (data.error || (typeof t === 'function' ? t('um_err_unknown') : '')));
                }
            } catch (e) {
                console.error('删除用户失败:', e);
                alert(typeof t === 'function' ? t('um_net_del') : '');
            }
        }

        window.addEventListener('click', function (e) {
            if (e.target.classList && e.target.classList.contains('um-modal')) {
                e.target.classList.remove('flex');
            }
        });

        var umTableActionsBound = false;
        function bindUmTableActions() {
            if (umTableActionsBound) return;
            var tbody = document.getElementById('userTableBody');
            if (!tbody) return;
            umTableActionsBound = true;
            tbody.addEventListener('click', function (ev) {
                var editBtn = ev.target.closest && ev.target.closest('.um-open-edit');
                if (editBtn) {
                    var eid = parseInt(editBtn.getAttribute('data-user-id'), 10);
                    var euser = editBtn.getAttribute('data-username') || '';
                    var eem = editBtn.getAttribute('data-email') || '';
                    var erole = editBtn.getAttribute('data-role') || 'tester';
                    showEditModal(eid, euser, eem, erole);
                    return;
                }
                var delBtn = ev.target.closest && ev.target.closest('.um-open-del');
                if (delBtn) {
                    deleteUser(parseInt(delBtn.getAttribute('data-user-id'), 10), delBtn.getAttribute('data-username') || '');
                }
            });
        }

        function initUmPage() {
            try { document.title = typeof t === 'function' ? t('um_doc_title') : ''; } catch (e) {}
            if (typeof applyUiLang === 'function') applyUiLang();
            refreshUmSelectOptions();
            bindUmTableActions();
            loadUsers();
        }

        document.addEventListener('DOMContentLoaded', initUmPage);
        window.addEventListener('ui-preferences-updated', function (ev) {
            if (ev.detail && ev.detail.source === 'load') return;
            initUmPage();
        });
    </script>
{% endblock %}
