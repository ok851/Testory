<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - UI自动化测试平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 24px; margin-bottom: 20px; }
        .btn { padding: 8px 16px; border-radius: 4px; font-size: 14px; cursor: pointer; border: none; transition: all 0.3s; }
        .btn-primary { background: #1890ff; color: white; }
        .btn-primary:hover { background: #40a9ff; }
        .btn-danger { background: #ff4d4f; color: white; }
        .btn-danger:hover { background: #ff7875; }
        .btn-success { background: #52c41a; color: white; }
        .btn-success:hover { background: #73d13d; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #f0f0f0; }
        th { background: #fafafa; font-weight: 600; }
        tr:hover { background: #fafafa; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; border-radius: 8px; padding: 24px; width: 90%; max-width: 500px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; }
        .badge { padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .badge-admin { background: #fff1f0; color: #cf1322; }
        .badge-tester { background: #e6f7ff; color: #096dd9; }
        .badge-viewer { background: #f6ffed; color: #389e0d; }
        .nav-bar { background: white; padding: 12px 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="nav-bar">
        <div style="display: flex; align-items: center; gap: 12px;">
            <i class="fas fa-robot" style="font-size: 24px; color: #1890ff;"></i>
            <h1 style="font-size: 18px; font-weight: 600;">UI 自动化测试平台</h1>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
            <a href="/" style="color: #666; text-decoration: none;"><i class="fas fa-home"></i> 首页</a>
            <span style="color: #999;">|</span>
            <span id="currentUser" style="color: #666;"></span>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="font-size: 20px; font-weight: 600;"><i class="fas fa-users" style="margin-right: 8px; color: #1890ff;"></i>用户管理</h2>
                <button class="btn btn-primary" onclick="showCreateModal()">
                    <i class="fas fa-plus"></i> 创建用户
                </button>
            </div>

            <table id="userTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>用户名</th>
                        <th>邮箱</th>
                        <th>角色</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- 动态加载 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 创建用户模态框 -->
    <div id="createModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px;">创建新用户</h3>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="newUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="newPassword" placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="newEmail" placeholder="可选">
            </div>
            <div class="form-group">
                <label>角色</label>
                <select id="newRole">
                    <option value="tester">测试人员</option>
                    <option value="admin">管理员</option>
                    <option value="viewer">只读用户</option>
                </select>
            </div>
            <div style="display: flex; gap: 12px; justify-content: flex-end;">
                <button class="btn" style="background: #f0f0f0;" onclick="closeModal('createModal')">取消</button>
                <button class="btn btn-primary" onclick="createUser()">创建</button>
            </div>
        </div>
    </div>

    <!-- 编辑用户模态框 -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px;">编辑用户</h3>
            <input type="hidden" id="editUserId">
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="editEmail" placeholder="可选">
            </div>
            <div class="form-group">
                <label>角色</label>
                <select id="editRole">
                    <option value="tester">测试人员</option>
                    <option value="admin">管理员</option>
                    <option value="viewer">只读用户</option>
                </select>
            </div>
            <div class="form-group">
                <label>新密码（留空则不修改）</label>
                <input type="password" id="editPassword" placeholder="不修改请留空">
            </div>
            <div style="display: flex; gap: 12px; justify-content: flex-end;">
                <button class="btn" style="background: #f0f0f0;" onclick="closeModal('editModal')">取消</button>
                <button class="btn btn-primary" onclick="updateUser()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // 加载用户列表
        async function loadUsers() {
            try {
                const res = await fetch('/api/users');
                const data = await res.json();
                if (data.success) {
                    renderUsers(data.users);
                } else {
                    alert('加载用户列表失败: ' + (data.error || '未知错误'));
                }
            } catch (e) {
                console.error('加载用户失败:', e);
                alert('加载用户列表失败');
            }
        }

        // 渲染用户列表
        function renderUsers(users) {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>${u.id}</td>
                    <td>${u.username}</td>
                    <td>${u.email || '-'}</td>
                    <td><span class="badge badge-${u.role}">${roleName(u.role)}</span></td>
                    <td>${u.is_active ? '<span style="color: #52c41a;">启用</span>' : '<span style="color: #999;">禁用</span>'}</td>
                    <td>${new Date(u.created_at).toLocaleString('zh-CN')}</td>
                    <td>
                        <button class="btn btn-primary" style="padding: 4px 12px; font-size: 12px;" onclick="showEditModal(${u.id}, '${u.email || ''}', '${u.role}')">
                            <i class="fas fa-edit"></i> 编辑
                        </button>
                        <button class="btn btn-danger" style="padding: 4px 12px; font-size: 12px; margin-left: 8px;" onclick="deleteUser(${u.id}, '${u.username}')">
                            <i class="fas fa-trash"></i> 删除
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function roleName(role) {
            const map = { admin: '管理员', tester: '测试人员', viewer: '只读用户' };
            return map[role] || role;
        }

        // 显示创建模态框
        function showCreateModal() {
            document.getElementById('createModal').style.display = 'flex';
        }

        // 显示编辑模态框
        function showEditModal(id, email, role) {
            document.getElementById('editUserId').value = id;
            document.getElementById('editEmail').value = email;
            document.getElementById('editRole').value = role;
            document.getElementById('editPassword').value = '';
            document.getElementById('editModal').style.display = 'flex';
        }

        // 关闭模态框
        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        // 创建用户
        async function createUser() {
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value;
            const email = document.getElementById('newEmail').value.trim();
            const role = document.getElementById('newRole').value;

            if (!username || !password) {
                alert('用户名和密码不能为空');
                return;
            }

            try {
                const res = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, email, role })
                });
                const data = await res.json();
                if (data.success) {
                    alert('用户创建成功');
                    closeModal('createModal');
                    loadUsers();
                    // 清空表单
                    document.getElementById('newUsername').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('newEmail').value = '';
                } else {
                    alert('创建失败: ' + (data.error || '未知错误'));
                }
            } catch (e) {
                console.error('创建用户失败:', e);
                alert('创建用户失败');
            }
        }

        // 更新用户
        async function updateUser() {
            const id = document.getElementById('editUserId').value;
            const email = document.getElementById('editEmail').value.trim();
            const role = document.getElementById('editRole').value;
            const password = document.getElementById('editPassword').value;

            const body = { email, role };
            if (password) body.password = password;

            try {
                const res = await fetch(`/api/users/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (data.success) {
                    alert('用户更新成功');
                    closeModal('editModal');
                    loadUsers();
                } else {
                    alert('更新失败: ' + (data.error || '未知错误'));
                }
            } catch (e) {
                console.error('更新用户失败:', e);
                alert('更新用户失败');
            }
        }

        // 删除用户
        async function deleteUser(id, username) {
            if (!confirm(`确定要删除用户 "${username}" 吗？`)) return;

            try {
                const res = await fetch(`/api/users/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    alert('用户删除成功');
                    loadUsers();
                } else {
                    alert('删除失败: ' + (data.error || '未知错误'));
                }
            } catch (e) {
                console.error('删除用户失败:', e);
                alert('删除用户失败');
            }
        }

        // 点击模态框外部关闭
        window.onclick = function(e) {
            if (e.target.classList.contains('modal')) {
                e.target.style.display = 'none';
            }
        }

        // 页面加载时获取当前用户信息
        async function loadCurrentUser() {
            try {
                const res = await fetch('/api/auth/me');
                const data = await res.json();
                if (data.success) {
                    document.getElementById('currentUser').innerHTML = `<i class="fas fa-user"></i> ${data.user.username}`;
                }
            } catch (e) {
                console.error('获取当前用户失败:', e);
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadUsers();
            loadCurrentUser();
        });
    </script>
</body>
</html>
