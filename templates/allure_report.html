<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试报告 - Allure 风格</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .allure-sidebar { background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%); }
        .allure-card { @apply bg-white rounded-lg shadow-sm border border-gray-100; }
        .status-passed { @apply bg-green-500; }
        .status-failed { @apply bg-red-500; }
        .status-broken { @apply bg-orange-500; }
        .status-skipped { @apply bg-gray-400; }
        .status-unknown { @apply bg-purple-500; }
        .trend-up { color: #22c55e; }
        .trend-down { color: #ef4444; }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <div class="flex h-screen">
        <!-- 侧边栏 -->
        <aside class="allure-sidebar w-64 text-white flex-shrink-0">
            <div class="p-6">
                <div class="flex items-center mb-8">
                    <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center mr-3">
                        <i class="fas fa-chart-pie text-lg"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg">Allure Report</h1>
                        <p class="text-gray-400 text-xs">测试报告</p>
                    </div>
                </div>

                <nav class="space-y-2">
                    <a href="#overview" class="flex items-center px-4 py-3 rounded-lg bg-white/10 text-white">
                        <i class="fas fa-home w-5 mr-3"></i>概览
                    </a>
                    <a href="#suites" class="flex items-center px-4 py-3 rounded-lg hover:bg-white/5 text-gray-300 hover:text-white transition-colors">
                        <i class="fas fa-folder w-5 mr-3"></i>测试套件
                    </a>
                    <a href="#graphs" class="flex items-center px-4 py-3 rounded-lg hover:bg-white/5 text-gray-300 hover:text-white transition-colors">
                        <i class="fas fa-chart-line w-5 mr-3"></i>图表
                    </a>
                    <a href="#timeline" class="flex items-center px-4 py-3 rounded-lg hover:bg-white/5 text-gray-300 hover:text-white transition-colors">
                        <i class="fas fa-clock w-5 mr-3"></i>时间线
                    </a>
                    <a href="#behaviors" class="flex items-center px-4 py-3 rounded-lg hover:bg-white/5 text-gray-300 hover:text-white transition-colors">
                        <i class="fas fa-tasks w-5 mr-3"></i>行为
                    </a>
                </nav>
            </div>

            <!-- 快速筛选 -->
            <div class="px-6 mt-4">
                <h3 class="text-xs uppercase tracking-wider text-gray-400 mb-3">状态筛选</h3>
                <div class="space-y-2">
                    <label class="flex items-center text-sm cursor-pointer">
                        <input type="checkbox" checked class="mr-2 rounded" onchange="filterByStatus('passed', this.checked)">
                        <span class="w-2 h-2 rounded-full status-passed mr-2"></span>通过
                    </label>
                    <label class="flex items-center text-sm cursor-pointer">
                        <input type="checkbox" checked class="mr-2 rounded" onchange="filterByStatus('failed', this.checked)">
                        <span class="w-2 h-2 rounded-full status-failed mr-2"></span>失败
                    </label>
                    <label class="flex items-center text-sm cursor-pointer">
                        <input type="checkbox" checked class="mr-2 rounded" onchange="filterByStatus('broken', this.checked)">
                        <span class="w-2 h-2 rounded-full status-broken mr-2"></span>异常
                    </label>
                    <label class="flex items-center text-sm cursor-pointer">
                        <input type="checkbox" checked class="mr-2 rounded" onchange="filterByStatus('skipped', this.checked)">
                        <span class="w-2 h-2 rounded-full status-skipped mr-2"></span>跳过
                    </label>
                </div>
            </div>

            <!-- 报告信息 -->
            <div class="absolute bottom-0 left-0 right-0 p-6 border-t border-white/10">
                <div class="text-xs text-gray-400">
                    <p>生成时间: <span id="reportTime">-</span></p>
                    <p>执行耗时: <span id="totalDuration">-</span></p>
                </div>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="flex-1 overflow-auto">
            <div class="p-8">
                <!-- 顶部工具栏 -->
                <div class="flex justify-between items-center mb-8">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900">测试执行报告</h2>
                        <p class="text-gray-500 mt-1">项目: <span id="projectName">-</span></p>
                    </div>
                    <div class="flex space-x-3">
                        <select id="projectSelect" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" onchange="loadReportData()">
                            <option value="">选择项目</option>
                        </select>
                        <select id="dateRange" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" onchange="loadReportData()">
                            <option value="7">最近7天</option>
                            <option value="30" selected>最近30天</option>
                            <option value="90">最近90天</option>
                        </select>
                        <button onclick="exportReport()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                            <i class="fas fa-download mr-2"></i>导出
                        </button>
                    </div>
                </div>

                <!-- 概览卡片 -->
                <section id="overview" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <!-- 总用例数 -->
                    <div class="allure-card p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500">总执行次数</p>
                                <p id="totalRuns" class="text-3xl font-bold text-gray-900 mt-1">0</p>
                            </div>
                            <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center">
                                <i class="fas fa-play-circle text-blue-600 text-xl"></i>
                            </div>
                        </div>
                        <div class="mt-4 flex items-center text-sm">
                            <span id="runsTrend" class="trend-up"><i class="fas fa-arrow-up mr-1"></i>12%</span>
                            <span class="text-gray-400 ml-2">较上周</span>
                        </div>
                    </div>

                    <!-- 通过率 -->
                    <div class="allure-card p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500">通过率</p>
                                <p id="passRate" class="text-3xl font-bold text-green-600 mt-1">0%</p>
                            </div>
                            <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center">
                                <i class="fas fa-check-circle text-green-600 text-xl"></i>
                            </div>
                        </div>
                        <div class="mt-4">
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div id="passRateBar" class="bg-green-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 平均耗时 -->
                    <div class="allure-card p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500">平均耗时</p>
                                <p id="avgDuration" class="text-3xl font-bold text-gray-900 mt-1">0s</p>
                            </div>
                            <div class="w-12 h-12 rounded-full bg-purple-100 flex items-center justify-center">
                                <i class="fas fa-stopwatch text-purple-600 text-xl"></i>
                            </div>
                        </div>
                        <div class="mt-4 flex items-center text-sm">
                            <span id="durationTrend" class="trend-down"><i class="fas fa-arrow-down mr-1"></i>8%</span>
                            <span class="text-gray-400 ml-2">较上周</span>
                        </div>
                    </div>

                    <!-- 失败用例 -->
                    <div class="allure-card p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500">失败用例</p>
                                <p id="failedCases" class="text-3xl font-bold text-red-600 mt-1">0</p>
                            </div>
                            <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center">
                                <i class="fas fa-times-circle text-red-600 text-xl"></i>
                            </div>
                        </div>
                        <div class="mt-4 text-sm text-gray-500">
                            需要关注
                        </div>
                    </div>
                </section>

                <!-- 图表区域 -->
                <section id="graphs" class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                    <!-- 状态分布饼图 -->
                    <div class="allure-card p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">状态分布</h3>
                        <div class="h-64">
                            <canvas id="statusChart"></canvas>
                        </div>
                    </div>

                    <!-- 趋势图 -->
                    <div class="allure-card p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">执行趋势</h3>
                        <div class="h-64">
                            <canvas id="trendChart"></canvas>
                        </div>
                    </div>
                </section>

                <!-- 耗时分布 -->
                <section class="allure-card p-6 mb-8">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">耗时分布</h3>
                    <div class="h-64">
                        <canvas id="durationChart"></canvas>
                    </div>
                </section>

                <!-- 用例列表 -->
                <section id="suites" class="allure-card p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold text-gray-900">最近执行记录</h3>
                        <input type="text" id="searchInput" placeholder="搜索用例..." class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 w-64" oninput="filterCases()">
                    </div>
                    <div class="overflow-x-auto">
                        <table class="min-w-full">
                            <thead>
                                <tr class="border-b border-gray-200">
                                    <th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">状态</th>
                                    <th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">用例名称</th>
                                    <th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">项目</th>
                                    <th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">耗时</th>
                                    <th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">执行时间</th>
                                    <th class="py-3 px-4 text-left text-xs font-semibold text-gray-500 uppercase">操作</th>
                                </tr>
                            </thead>
                            <tbody id="casesTableBody">
                                <tr>
                                    <td colspan="6" class="py-8 text-center text-gray-500">
                                        <i class="fas fa-spinner fa-spin mr-2"></i>加载中...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        let statusChart, trendChart, durationChart;
        let reportData = null;

        // 初始化图表
        function initCharts() {
            // 状态分布饼图
            const statusCtx = document.getElementById('statusChart').getContext('2d');
            statusChart = new Chart(statusCtx, {
                type: 'doughnut',
                data: {
                    labels: ['通过', '失败', '异常', '跳过'],
                    datasets: [{
                        data: [0, 0, 0, 0],
                        backgroundColor: ['#22c55e', '#ef4444', '#f97316', '#9ca3af'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right'
                        }
                    },
                    cutout: '60%'
                }
            });

            // 趋势图
            const trendCtx = document.getElementById('trendChart').getContext('2d');
            trendChart = new Chart(trendCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '通过',
                        data: [],
                        borderColor: '#22c55e',
                        backgroundColor: 'rgba(34, 197, 94, 0.1)',
                        fill: true,
                        tension: 0.4
                    }, {
                        label: '失败',
                        data: [],
                        borderColor: '#ef4444',
                        backgroundColor: 'rgba(239, 68, 68, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

            // 耗时分布图
            const durationCtx = document.getElementById('durationChart').getContext('2d');
            durationChart = new Chart(durationCtx, {
                type: 'bar',
                data: {
                    labels: ['<1s', '1-5s', '5-10s', '10-30s', '30-60s', '>60s'],
                    datasets: [{
                        label: '用例数',
                        data: [0, 0, 0, 0, 0, 0],
                        backgroundColor: '#3b82f6'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // 加载项目列表
        async function loadProjects() {
            try {
                const response = await fetch('/api/projects');
                const result = await response.json();
                const select = document.getElementById('projectSelect');
                
                if (result.projects) {
                    result.projects.forEach(p => {
                        const option = document.createElement('option');
                        option.value = p.id;
                        option.textContent = p.name;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('加载项目失败:', error);
            }
        }

        // 加载报告数据
        async function loadReportData() {
            const projectId = document.getElementById('projectSelect').value;
            const days = document.getElementById('dateRange').value;
            
            try {
                // 加载统计数据
                let url = `/api/report/statistics?days=${days}`;
                if (projectId) url += `&project_id=${projectId}`;
                
                const statsResponse = await fetch(url);
                const statsResult = await statsResponse.json();
                
                if (statsResult.success) {
                    updateOverview(statsResult.data);
                    updateCharts(statsResult.data);
                }
                
                // 加载执行历史
                let historyUrl = `/api/run-history?page=1&page_size=50`;
                if (projectId) historyUrl += `&project_id=${projectId}`;
                
                const historyResponse = await fetch(historyUrl);
                const historyResult = await historyResponse.json();
                
                if (historyResult.histories) {
                    renderCasesList(historyResult.histories);
                }
                
                // 更新报告时间
                document.getElementById('reportTime').textContent = new Date().toLocaleString('zh-CN');
                if (projectId) {
                    const projectName = document.getElementById('projectSelect').selectedOptions[0].text;
                    document.getElementById('projectName').textContent = projectName;
                } else {
                    document.getElementById('projectName').textContent = '全部项目';
                }
                
            } catch (error) {
                console.error('加载报告数据失败:', error);
            }
        }

        // 更新概览数据
        function updateOverview(data) {
            document.getElementById('totalRuns').textContent = data.total_runs || 0;
            document.getElementById('passRate').textContent = `${data.pass_rate || 0}%`;
            document.getElementById('passRateBar').style.width = `${data.pass_rate || 0}%`;
            document.getElementById('avgDuration').textContent = formatDuration(data.avg_duration || 0);
            document.getElementById('failedCases').textContent = data.failed_runs || 0;
            document.getElementById('totalDuration').textContent = formatDuration(data.total_duration || 0);
        }

        // 更新图表
        function updateCharts(data) {
            // 更新状态分布
            if (data.status_distribution) {
                const passed = data.status_distribution.find(s => s.status === 'passed' || s.status === 'success')?.count || 0;
                const failed = data.status_distribution.find(s => s.status === 'failed')?.count || 0;
                const error = data.status_distribution.find(s => s.status === 'error')?.count || 0;
                const other = (data.total_runs || 0) - passed - failed - error;
                
                statusChart.data.datasets[0].data = [passed, failed, error, other];
                statusChart.update();
            }

            // 更新趋势图（模拟数据）
            const days = parseInt(document.getElementById('dateRange').value);
            const labels = [];
            const passedData = [];
            const failedData = [];
            
            for (let i = days - 1; i >= 0; i--) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                labels.push(`${date.getMonth() + 1}/${date.getDate()}`);
                passedData.push(Math.floor(Math.random() * 20) + 5);
                failedData.push(Math.floor(Math.random() * 5));
            }
            
            trendChart.data.labels = labels;
            trendChart.data.datasets[0].data = passedData;
            trendChart.data.datasets[1].data = failedData;
            trendChart.update();

            // 更新耗时分布（模拟数据）
            if (data.duration_distribution) {
                const dist = data.duration_distribution;
                durationChart.data.datasets[0].data = [
                    dist['0-1'] || 0,
                    dist['1-5'] || 0,
                    dist['5-10'] || 0,
                    dist['10-30'] || 0,
                    dist['30-60'] || 0,
                    dist['60+'] || 0
                ];
            } else {
                durationChart.data.datasets[0].data = [15, 25, 10, 5, 3, 2];
            }
            durationChart.update();
        }

        // 渲染用例列表
        function renderCasesList(histories) {
            const tbody = document.getElementById('casesTableBody');
            
            if (!histories || histories.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="py-8 text-center text-gray-500">
                            <i class="fas fa-inbox mr-2"></i>暂无执行记录
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = histories.map(h => {
                const statusClass = getStatusClass(h.status);
                const statusText = getStatusText(h.status);
                
                return `
                    <tr class="border-b border-gray-100 hover:bg-gray-50 case-row" data-status="${h.status}">
                        <td class="py-3 px-4">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${statusClass}">
                                ${statusText}
                            </span>
                        </td>
                        <td class="py-3 px-4 font-medium text-gray-900">${h.case_name || '未知用例'}</td>
                        <td class="py-3 px-4 text-gray-500">${h.project_name || '-'}</td>
                        <td class="py-3 px-4 text-gray-500">${formatDuration(h.duration)}</td>
                        <td class="py-3 px-4 text-gray-500">${formatTime(h.created_at)}</td>
                        <td class="py-3 px-4">
                            <a href="/run-history?id=${h.id}" class="text-blue-600 hover:text-blue-800">
                                <i class="fas fa-eye"></i>
                            </a>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function getStatusClass(status) {
            const classes = {
                'passed': 'bg-green-100 text-green-800',
                'success': 'bg-green-100 text-green-800',
                'failed': 'bg-red-100 text-red-800',
                'error': 'bg-orange-100 text-orange-800',
                'skipped': 'bg-gray-100 text-gray-800'
            };
            return classes[status] || 'bg-gray-100 text-gray-800';
        }

        function getStatusText(status) {
            const texts = {
                'passed': '通过',
                'success': '通过',
                'failed': '失败',
                'error': '异常',
                'skipped': '跳过'
            };
            return texts[status] || status;
        }

        function formatDuration(seconds) {
            if (!seconds || seconds === 0) return '0s';
            if (seconds < 1) return `${Math.round(seconds * 1000)}ms`;
            if (seconds < 60) return `${seconds.toFixed(1)}s`;
            const mins = Math.floor(seconds / 60);
            const secs = Math.round(seconds % 60);
            return `${mins}m ${secs}s`;
        }

        function formatTime(timeStr) {
            if (!timeStr) return '-';
            return new Date(timeStr).toLocaleString('zh-CN');
        }

        function filterByStatus(status, checked) {
            document.querySelectorAll('.case-row').forEach(row => {
                if (row.dataset.status === status || row.dataset.status === 'success' && status === 'passed') {
                    row.style.display = checked ? '' : 'none';
                }
            });
        }

        function filterCases() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.case-row').forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(keyword) ? '' : 'none';
            });
        }

        async function exportReport() {
            alert('报告导出功能开发中...');
        }

        // 页面初始化
        document.addEventListener('DOMContentLoaded', () => {
            initCharts();
            loadProjects();
            loadReportData();
        });
    </script>
</body>
</html>
