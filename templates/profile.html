<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息 - UI自动化测试平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        accent: '#8b5cf6',
                        danger: '#ef4444',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .btn {
                @apply px-4 py-2 rounded-md font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2;
            }
            .btn-primary {
                @apply bg-primary text-white hover:bg-blue-600 focus:ring-blue-500;
            }
            .btn-secondary {
                @apply bg-secondary text-white hover:bg-green-600 focus:ring-green-500;
            }
            .btn-danger {
                @apply bg-danger text-white hover:bg-red-600 focus:ring-red-500;
            }
            .card {
                @apply bg-white rounded-lg shadow-md p-6;
            }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-3">
                    <i class="fas fa-robot text-primary text-2xl"></i>
                    <h1 class="text-xl font-bold text-gray-800">UI 自动化测试平台</h1>
                </div>
                <div class="flex items-center gap-4">
                    <a href="/" class="btn btn-secondary text-sm">
                        <i class="fas fa-arrow-left mr-2"></i>返回首页
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="max-w-3xl mx-auto px-4 py-8">
        <!-- 页面标题 -->
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-gray-800">
                <i class="fas fa-user-circle text-primary mr-3"></i>
                个人信息
            </h2>
            <p class="text-gray-600 mt-2">管理您的账号信息和密码</p>
        </div>

        <!-- 基本信息卡片 -->
        <div class="card mb-6">
            <h3 class="text-xl font-semibold text-gray-700 mb-6 flex items-center">
                <i class="fas fa-id-card text-primary mr-3"></i>
                基本信息
            </h3>
            <form id="profileForm" class="space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">用户名</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                <i class="fas fa-user"></i>
                            </span>
                            <input type="text" id="username" 
                                class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md bg-gray-100 text-gray-600 cursor-not-allowed" 
                                disabled>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">用户名不可修改</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">角色</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                <i class="fas fa-shield-alt"></i>
                            </span>
                            <input type="text" id="role" 
                                class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md bg-gray-100 text-gray-600 cursor-not-allowed" 
                                disabled>
                        </div>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">邮箱</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="fas fa-envelope"></i>
                        </span>
                        <input type="email" id="email" 
                            class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" 
                            placeholder="请输入邮箱地址">
                    </div>
                </div>
                <div class="flex justify-end pt-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save mr-2"></i>保存修改
                    </button>
                </div>
            </form>
        </div>

        <!-- 修改密码卡片 -->
        <div class="card">
            <h3 class="text-xl font-semibold text-gray-700 mb-6 flex items-center">
                <i class="fas fa-lock text-primary mr-3"></i>
                修改密码
            </h3>
            <form id="passwordForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">原密码</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="fas fa-key"></i>
                        </span>
                        <input type="password" id="oldPassword" 
                            class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" 
                            placeholder="请输入原密码" required>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">新密码</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" id="newPassword" 
                                class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" 
                                placeholder="至少6位" required minlength="6">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">确认新密码</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" id="confirmPassword" 
                                class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" 
                                placeholder="请再次输入" required minlength="6">
                        </div>
                    </div>
                </div>
                <p id="passwordError" class="text-sm text-red-600 hidden">
                    <i class="fas fa-exclamation-circle mr-1"></i>两次输入的密码不一致
                </p>
                <div class="flex justify-end pt-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-key mr-2"></i>修改密码
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 加载用户信息
        async function loadUserInfo() {
            try {
                const response = await fetch('/api/auth/me');
                const result = await response.json();
                if (result.success) {
                    document.getElementById('username').value = result.user.username;
                    document.getElementById('role').value = result.user.role === 'admin' ? '管理员' : '测试人员';
                    // 获取完整用户信息（包含邮箱）
                    const userResponse = await fetch('/api/users');
                    const userResult = await userResponse.json();
                    if (userResult.success) {
                        const currentUser = userResult.users.find(u => u.id === result.user.id);
                        if (currentUser && currentUser.email) {
                            document.getElementById('email').value = currentUser.email;
                        }
                    }
                }
            } catch (error) {
                console.error('加载用户信息失败:', error);
                alert('加载用户信息失败，请刷新页面重试');
            }
        }

        // 保存个人信息
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();

            if (email && !email.includes('@')) {
                alert('请输入正确的邮箱格式');
                return;
            }

            try {
                const response = await fetch('/api/auth/me', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const result = await response.json();
                if (result.success) {
                    alert('个人信息保存成功');
                } else {
                    alert(result.error || '保存失败');
                }
            } catch (error) {
                console.error('保存失败:', error);
                alert('保存失败，请重试');
            }
        });

        // 修改密码
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorEl = document.getElementById('passwordError');

            if (newPassword !== confirmPassword) {
                errorEl.classList.remove('hidden');
                return;
            }
            errorEl.classList.add('hidden');

            if (newPassword.length < 6) {
                alert('新密码长度不能少于6位');
                return;
            }

            try {
                const response = await fetch('/api/auth/change_password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ old_password: oldPassword, new_password: newPassword })
                });
                const result = await response.json();
                if (result.success) {
                    alert('密码修改成功，请使用新密码重新登录');
                    document.getElementById('passwordForm').reset();
                } else {
                    alert(result.error || '密码修改失败');
                }
            } catch (error) {
                console.error('修改密码失败:', error);
                alert('修改密码失败，请重试');
            }
        });

        // 页面加载时获取用户信息
        loadUserInfo();
    </script>
</body>
</html>
