<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试报告 - UI自动化测试平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        accent: '#8b5cf6',
                        danger: '#ef4444',
                        warning: '#f59e0b',
                        info: '#3b82f6',
                        light: '#f3f4f6',
                        dark: '#1f2937',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .btn {
                @apply px-4 py-2 rounded-md font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2;
            }
            .btn-primary {
                @apply bg-primary text-white hover:bg-blue-600 focus:ring-blue-500;
            }
            .btn-secondary {
                @apply bg-secondary text-white hover:bg-green-600 focus:ring-green-500;
            }
            .btn-accent {
                @apply bg-accent text-white hover:bg-purple-600 focus:ring-purple-500;
            }
            .card {
                @apply bg-white rounded-lg shadow-md p-6;
            }
            .stat-card {
                @apply bg-gradient-to-br from-blue-50 to-purple-50 rounded-lg shadow-md p-6 border-l-4 border-primary;
            }
        }
        
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border-radius: 0.5rem;
        }
        
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50/30 to-indigo-50/20 font-sans min-h-screen">
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <!-- 左侧：Logo -->
            <div class="flex items-center gap-3">
                <i class="fas fa-robot text-primary text-2xl"></i>
                <h1 class="text-xl font-bold text-gray-800">UI 自动化测试平台</h1>
            </div>
            <!-- 右侧：功能按钮 + 用户信息 -->
            <div class="flex items-center gap-2">
                <a href="/" class="btn btn-primary" title="首页">
                    <i class="fas fa-home"></i>
                </a>
                <a href="/list_projects" class="btn btn-secondary" title="项目管理">
                    <i class="fas fa-folder mr-1"></i>项目
                </a>
                <a href="/run-history" class="btn btn-accent" title="运行历史">
                    <i class="fas fa-history mr-1"></i>历史
                </a>
                <a href="/data-driven" class="btn btn-primary bg-purple-600 hover:bg-purple-700 focus:ring-purple-500" title="数据驱动">
                    <i class="fas fa-table mr-1"></i>数据
                </a>
                <a href="/test_report" class="btn btn-primary bg-blue-600 hover:bg-blue-700 focus:ring-blue-500" title="测试报告">
                    <i class="fas fa-chart-bar mr-1"></i>报告
                </a>
                <a href="/schedules" class="btn btn-primary bg-orange-500 hover:bg-orange-600 focus:ring-orange-500" title="定时任务">
                    <i class="fas fa-clock mr-1"></i>定时
                </a>
                <a href="/notifications" class="btn btn-primary bg-pink-500 hover:bg-pink-600 focus:ring-pink-500" title="通知配置">
                    <i class="fas fa-bell mr-1"></i>通知
                </a>
                <a href="/defects" class="btn btn-danger bg-red-600 hover:bg-red-700 focus:ring-red-500" title="缺陷管理">
                    <i class="fas fa-bug mr-1"></i>缺陷
                </a>
                <!-- 用户信息区（最右边） -->
                <div id="userArea" class="flex items-center gap-2 border-l border-gray-300 pl-4 ml-2">
                    <!-- 用户下拉菜单 -->
                    <div id="userDropdown" class="relative hidden">
                        <button onclick="toggleUserMenu()" class="flex items-center gap-2 px-3 py-2 rounded-md hover:bg-gray-100 transition-colors">
                            <i class="fas fa-user-circle text-gray-600 text-lg"></i>
                            <span id="userLabel" class="text-sm text-gray-700 font-medium"></span>
                            <i class="fas fa-chevron-down text-xs text-gray-400"></i>
                        </button>
                        <div id="userMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50 border border-gray-200">
                            <a href="/profile" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                <i class="fas fa-id-card mr-2 text-gray-400"></i>个人信息
                            </a>
                            <a href="/license" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                <i class="fas fa-key mr-2 text-gray-400"></i>授权管理
                            </a>
                            <div class="border-t border-gray-100 my-1"></div>
                            <button onclick="handleLogout()" class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100">
                                <i class="fas fa-sign-out-alt mr-2"></i>注销
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-gray-800 mb-2">
                <i class="fas fa-chart-bar text-primary mr-2"></i>
                测试报告
            </h2>
            <p class="text-gray-600">查看测试执行统计、趋势分析和详细报告</p>
        </div>

        <div class="card mb-6">
            <h3 class="text-lg font-semibold text-gray-700 mb-4">
                <i class="fas fa-filter text-primary mr-2"></i>
                筛选条件
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">项目</label>
                    <select id="projectFilter" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="">全部项目</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">开始日期</label>
                    <input type="date" id="startDate" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">结束日期</label>
                    <input type="date" id="endDate" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div class="flex items-end">
                    <button onclick="loadReportData()" class="btn btn-primary w-full">
                        <i class="fas fa-search mr-2"></i>
                        查询
                    </button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 mb-1">总执行次数</p>
                        <p class="text-3xl font-bold text-primary" id="totalRuns">0</p>
                    </div>
                    <div class="w-12 h-12 bg-primary bg-opacity-20 rounded-full flex items-center justify-center">
                        <i class="fas fa-play-circle text-primary text-2xl"></i>
                    </div>
                </div>
            </div>
            <div class="stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 mb-1">通过次数</p>
                        <p class="text-3xl font-bold text-secondary" id="passedRuns">0</p>
                    </div>
                    <div class="w-12 h-12 bg-secondary bg-opacity-20 rounded-full flex items-center justify-center">
                        <i class="fas fa-check-circle text-secondary text-2xl"></i>
                    </div>
                </div>
            </div>
            <div class="stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 mb-1">失败次数</p>
                        <p class="text-3xl font-bold text-danger" id="failedRuns">0</p>
                    </div>
                    <div class="w-12 h-12 bg-danger bg-opacity-20 rounded-full flex items-center justify-center">
                        <i class="fas fa-times-circle text-danger text-2xl"></i>
                    </div>
                </div>
            </div>
            <div class="stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 mb-1">通过率</p>
                        <p class="text-3xl font-bold text-accent" id="passRate">0%</p>
                    </div>
                    <div class="w-12 h-12 bg-accent bg-opacity-20 rounded-full flex items-center justify-center">
                        <i class="fas fa-percentage text-accent text-2xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="card">
                <h3 class="text-lg font-semibold text-gray-700 mb-4">
                    <i class="fas fa-chart-pie text-primary mr-2"></i>
                    状态分布
                </h3>
                <div class="relative h-80">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
            <div class="card">
                <h3 class="text-lg font-semibold text-gray-700 mb-4">
                    <i class="fas fa-clock text-primary mr-2"></i>
                    耗时分布
                </h3>
                <div class="relative h-80">
                    <canvas id="durationChart"></canvas>
                </div>
            </div>
        </div>

        <div class="card mb-8">
            <h3 class="text-lg font-semibold text-gray-700 mb-4">
                <i class="fas fa-chart-line text-primary mr-2"></i>
                执行趋势
            </h3>
            <div class="relative h-80">
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <div class="card mb-8">
            <h3 class="text-lg font-semibold text-gray-700 mb-4">
                <i class="fas fa-list text-primary mr-2"></i>
                用例统计
            </h3>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">用例名称</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">总执行次数</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">通过次数</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">失败次数</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">通过率</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">平均耗时</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">最后执行时间</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200" id="caseStatsTable">
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card mb-8">
            <h3 class="text-lg font-semibold text-gray-700 mb-4">
                <i class="fas fa-folder text-primary mr-2"></i>
                项目统计
            </h3>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">项目名称</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">用例数量</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">总执行次数</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">通过次数</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">失败次数</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">通过率</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">平均耗时</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200" id="projectStatsTable">
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h3 class="text-lg font-semibold text-gray-700 mb-4">
                <i class="fas fa-download text-primary mr-2"></i>
                导出报告
            </h3>
            <div class="flex flex-wrap gap-4">
                <button onclick="exportReport('html')" class="btn btn-primary">
                    <i class="fas fa-file-code mr-2"></i>
                    导出HTML
                </button>
                <button onclick="exportReport('excel')" class="btn btn-secondary">
                    <i class="fas fa-file-excel mr-2"></i>
                    导出Excel
                </button>
                <button onclick="exportReport('pdf')" class="btn btn-accent">
                    <i class="fas fa-file-pdf mr-2"></i>
                    导出PDF
                </button>
            </div>
        </div>
    </div>

    <script>
        let statusChart = null;
        let durationChart = null;
        let trendChart = null;

        document.addEventListener('DOMContentLoaded', function() {
            loadProjects();
            loadReportData();
        });

        function loadProjects() {
            const select = document.getElementById('projectFilter');
            if (!select) {
                console.error('找不到项目过滤器元素');
                return;
            }
            
            fetch('/api/projects')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (data && data.projects && Array.isArray(data.projects)) {
                        data.projects.forEach(project => {
                            if (project && project.id && project.name) {
                                const option = document.createElement('option');
                                option.value = project.id;
                                option.textContent = project.name;
                                select.appendChild(option);
                            }
                        });
                    } else {
                        console.warn('项目数据格式不正确或为空');
                    }
                })
                .catch(error => console.error('加载项目失败:', error));
        }

        function loadReportData() {
            const projectFilter = document.getElementById('projectFilter');
            const startDateInput = document.getElementById('startDate');
            const endDateInput = document.getElementById('endDate');
            
            if (!projectFilter || !startDateInput || !endDateInput) {
                console.error('找不到必要的表单元素');
                return;
            }
            
            const projectId = projectFilter.value;
            const startDate = startDateInput.value;
            const endDate = endDateInput.value;

            const params = new URLSearchParams();
            if (projectId) params.append('project_id', projectId);
            if (startDate) params.append('start_date', startDate);
            if (endDate) params.append('end_date', endDate);

            // 显示加载状态
            showLoadingState();

            Promise.all([
                fetch(`/api/report/overview?${params}`).then(r => {
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    return r.json();
                }),
                fetch(`/api/report/status-distribution?${params}`).then(r => {
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    return r.json();
                }),
                fetch(`/api/report/duration-distribution?${params}`).then(r => {
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    return r.json();
                }),
                fetch(`/api/report/trend?${params}`).then(r => {
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    return r.json();
                }),
                fetch(`/api/report/case-statistics?${params}`).then(r => {
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    return r.json();
                }),
                fetch(`/api/report/project-statistics?${params}`).then(r => {
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    return r.json();
                })
            ]).then(([overview, statusDist, durationDist, trend, caseStats, projectStats]) => {
                // 隐藏加载状态
                hideLoadingState();
                
                // 检查数据是否有效
                if (!overview || !overview.success || !overview.data) {
                    throw new Error('统计数据格式错误');
                }
                
                updateOverview(overview.data);
                updateStatusChart(statusDist.data || []);
                updateDurationChart(durationDist.data || {});
                updateTrendChart(trend.data || {});
                updateCaseStatsTable(caseStats.data || []);
                updateProjectStatsTable(projectStats.data || []);
            }).catch(error => {
                console.error('加载报告数据失败:', error);
                hideLoadingState();
                showErrorState('加载报告数据失败: ' + error.message);
            });
        }
        
        function showLoadingState() {
            // 显示所有卡片的加载状态
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                if (!card.querySelector('.loading-overlay')) {
                    const overlay = document.createElement('div');
                    overlay.className = 'loading-overlay';
                    overlay.innerHTML = `
                        <div class="flex items-center justify-center p-8">
                            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
                            <span class="ml-3 text-gray-600">加载中...</span>
                        </div>
                    `;
                    card.style.position = 'relative';
                    card.appendChild(overlay);
                }
            });
        }
        
        function hideLoadingState() {
            // 隐藏所有卡片的加载状态
            const overlays = document.querySelectorAll('.loading-overlay');
            overlays.forEach(overlay => {
                overlay.remove();
            });
        }
        
        function showErrorState(message) {
            // 显示错误信息
            const container = document.querySelector('.container');
            if (container) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-6';
                errorDiv.innerHTML = `
                    <strong class="font-bold">错误!</strong>
                    <span class="block sm:inline"> ${message}</span>
                `;
                container.insertBefore(errorDiv, container.firstChild);
                
                // 5秒后自动移除错误提示
                setTimeout(() => {
                    if (errorDiv.parentNode) {
                        errorDiv.parentNode.removeChild(errorDiv);
                    }
                }, 5000);
            }
        }

        function updateOverview(data) {
            document.getElementById('totalRuns').textContent = data.total_runs || 0;
            document.getElementById('passedRuns').textContent = data.passed_runs || 0;
            document.getElementById('failedRuns').textContent = data.failed_runs || 0;
            document.getElementById('passRate').textContent = (data.pass_rate || 0) + '%';
        }

        function updateStatusChart(data) {
            const ctx = document.getElementById('statusChart').getContext('2d');
            
            if (statusChart) {
                statusChart.destroy();
            }

            const labels = data.map(item => item.status);
            const counts = data.map(item => item.count);
            const colors = {
                'passed': '#10b981',
                'failed': '#ef4444',
                'success': '#10b981',
                'error': '#ef4444',
                'skipped': '#f59e0b',
                'unknown': '#6b7280'
            };

            statusChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: counts,
                        backgroundColor: labels.map(label => colors[label] || colors['unknown']),
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        function updateDurationChart(data) {
            const ctx = document.getElementById('durationChart').getContext('2d');
            
            if (durationChart) {
                durationChart.destroy();
            }

            durationChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: '执行次数',
                        data: data.data,
                        backgroundColor: 'rgba(59, 130, 246, 0.8)',
                        borderColor: 'rgba(59, 130, 246, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    }
                }
            });
        }

        function updateTrendChart(data) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            
            if (trendChart) {
                trendChart.destroy();
            }

            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.dates,
                    datasets: [
                        {
                            label: '总执行次数',
                            data: data.total,
                            borderColor: 'rgba(59, 130, 246, 1)',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: '通过次数',
                            data: data.passed,
                            borderColor: 'rgba(16, 185, 129, 1)',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: '失败次数',
                            data: data.failed,
                            borderColor: 'rgba(239, 68, 68, 1)',
                            backgroundColor: 'rgba(239, 68, 68, 0.1)',
                            fill: true,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    }
                }
            });
        }

        function updateCaseStatsTable(data) {
            const tbody = document.getElementById('caseStatsTable');
            if (!tbody) {
                console.error('找不到用例统计表表格体元素');
                return;
            }
            
            tbody.innerHTML = '';

            if (!Array.isArray(data) || data.length === 0) {
                const emptyRow = document.createElement('tr');
                emptyRow.innerHTML = `
                    <td colspan="7" class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-center">暂无用例统计数据</td>
                `;
                tbody.appendChild(emptyRow);
                return;
            }

            data.forEach(item => {
                if (!item || typeof item !== 'object') {
                    console.warn('发现无效的用例统计项:', item);
                    return;
                }
                
                const caseName = item.case_name || '未知用例';
                const totalRuns = item.total_runs || 0;
                const passedRuns = item.passed_runs || 0;
                const failedRuns = item.failed_runs || 0;
                const passRate = item.pass_rate || 0;
                const avgDuration = item.avg_duration || 0;
                const lastRunTime = item.last_run_time || '-';
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${caseName}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${totalRuns}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${passedRuns}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${failedRuns}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${passRate}%</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${avgDuration}秒</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${lastRunTime}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function updateProjectStatsTable(data) {
            const tbody = document.getElementById('projectStatsTable');
            if (!tbody) {
                console.error('找不到项目统计表格体元素');
                return;
            }
            
            tbody.innerHTML = '';

            if (!Array.isArray(data) || data.length === 0) {
                const emptyRow = document.createElement('tr');
                emptyRow.innerHTML = `
                    <td colspan="7" class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-center">暂无项目统计数据</td>
                `;
                tbody.appendChild(emptyRow);
                return;
            }

            data.forEach(item => {
                if (!item || typeof item !== 'object') {
                    console.warn('发现无效的项目统计项:', item);
                    return;
                }
                
                const projectName = item.project_name || '未知项目';
                const totalCases = item.total_cases || 0;
                const totalRuns = item.total_runs || 0;
                const passedRuns = item.passed_runs || 0;
                const failedRuns = item.failed_runs || 0;
                const passRate = item.pass_rate || 0;
                const avgDuration = item.avg_duration || 0;
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${projectName}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${totalCases}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${totalRuns}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${passedRuns}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${failedRuns}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${passRate}%</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${avgDuration}秒</td>
                `;
                tbody.appendChild(row);
            });
        }

        function exportReport(format) {
            const projectId = document.getElementById('projectFilter').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            const data = {
                format: format,
                project_id: projectId ? parseInt(projectId) : null,
                start_date: startDate,
                end_date: endDate
            };

            fetch('/api/report/export', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    alert(`报告已成功导出到: ${result.filepath}`);
                } else {
                    alert(`导出失败: ${result.error}`);
                }
            })
            .catch(error => {
                console.error('导出报告失败:', error);
                alert('导出报告失败，请重试');
            });
        }

        // ==================== 登录状态管理 ====================
        function initUserArea() {
            fetch('/api/auth/me')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        const user = data.user;
                        document.getElementById('userLabel').textContent = user.username;
                        document.getElementById('userDropdown').classList.remove('hidden');
                        document.getElementById('loginBtn').classList.add('hidden');
                    } else {
                        document.getElementById('loginBtn').classList.remove('hidden');
                        document.getElementById('userDropdown').classList.add('hidden');
                    }
                })
                .catch(() => {
                    document.getElementById('loginBtn').classList.remove('hidden');
                    document.getElementById('userDropdown').classList.add('hidden');
                });
        }

        // 切换用户菜单显示
        function toggleUserMenu() {
            const menu = document.getElementById('userMenu');
            menu.classList.toggle('hidden');
        }

        // 点击外部关闭菜单
        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('userDropdown');
            const menu = document.getElementById('userMenu');
            if (dropdown && !dropdown.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });

        async function handleLogout() {
            try {
                await fetch('/api/auth/logout', {method: 'POST'});
                localStorage.removeItem('currentUser');
                window.location.href = '/login';
            } catch(e) {
                window.location.href = '/login';
            }
        }

        // 页面加载
        document.addEventListener('DOMContentLoaded', function() {
            initUserArea();
        });
    </script>
</body>
</html>
