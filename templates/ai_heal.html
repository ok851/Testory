{% extends "base.html" %}
{% block title %}AI 自愈优化 - {{ product_name }}{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/ai_hub.css') }}?v=4">
<style>
    .ai-heal-page { padding: 24px; min-height: calc(100vh - 64px); position: relative; }
    .ai-heal-conversation { max-width: 720px; margin: 0 auto; padding-bottom: 40px; }
    .ai-heal-tab-body { display: none; }
    .ai-heal-tab-body--active { display: block; }
    .ai-heal-result-card {
        margin-top: 16px;
        background: rgba(255,255,255,0.8);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(199,210,254,0.6);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 4px 20px rgba(79,70,229,0.06);
    }
    .ai-heal-result-item {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 0; border-bottom: 1px solid rgba(226,232,240,0.6);
        font-size: 13px; color: #334155;
    }
    .ai-heal-result-item:last-child { border-bottom: none; }
    .ai-heal-result-badge {
        width: 24px; height: 24px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; flex-shrink: 0;
    }
    .ai-heal-result-badge--ok { background: #dcfce7; }
    .ai-heal-result-badge--warn { background: #fef3c7; }
    .ai-heal-result-badge--info { background: #e0e7ff; }
    html.dark .ai-heal-result-card {
        background: rgba(30,41,59,0.7);
        border-color: rgba(67,56,202,0.4);
    }
    html.dark .ai-heal-result-item { color: #e2e8f0; border-color: rgba(51,65,85,0.6); }
</style>
{% endblock %}
{% block content %}
<div class="ai-heal-page">
    <div class="ai-particle-bg"></div>
    <div class="ai-heal-conversation">
        <header class="ai-module-top" style="margin-bottom:24px;">
            <a href="/ai-hub" class="ai-hub-back" title="返回 AI 中心"><i class="fas fa-arrow-left"></i></a>
            <div>
                <h1 data-i18n="aiheal_title">AI 自愈优化</h1>
                <p data-i18n="aiheal_subtitle">定位器预修复与失败诊断，让用例自动适应界面变更。</p>
            </div>
        </header>

        <!-- Tab 切换 -->
        <div class="ai-tab-bar" style="margin-bottom:20px;">
            <button type="button" class="ai-tab ai-tab--active" data-tab="locator" id="aiHealTabLocator">🔧 定位器修复</button>
            <button type="button" class="ai-tab" data-tab="diag" id="aiHealTabDiag">🩺 失败诊断</button>
        </div>

        <!-- 定位器修复 Tab -->
        <div class="ai-heal-tab-body ai-heal-tab-body--active" id="aiHealBodyLocator">
            <div class="ai-design-row">
                <label for="aiHealProject">项目</label>
                <select id="aiHealProject" class="ai-design-control"><option value="">加载中…</option></select>
            </div>
            <div class="ai-design-row">
                <label for="aiHealCase">用例</label>
                <select id="aiHealCase" class="ai-design-control"><option value="">先选项目</option></select>
            </div>
            <div class="ai-design-row">
                <label for="aiHealUrl">目标页面 URL</label>
                <input type="url" id="aiHealUrl" class="ai-design-control" placeholder="https://example.com" />
            </div>
            <div class="ai-design-actions">
                <button type="button" class="ai-glow-btn" id="aiHealPreviewBtn">预览定位解析</button>
                <button type="button" class="ai-btn ai-btn--primary" id="aiHealSaveBtn" disabled>保存到用例</button>
            </div>
            <!-- 思维链 -->
            <div id="aiHealLocatorThinking" class="ai-thinking-chain" style="display:none;margin-top:16px;">
                <div class="ai-thinking-chain__title"><span class="ai-thinking-chain__pulse"></span>AI 正在修复定位器</div>
                <div id="aiHealLocatorThinkingInner"></div>
            </div>
            <!-- 修复总结 -->
            <div id="aiHealLocatorSummary" class="ai-task-summary" style="display:none;margin-top:16px;"></div>
            <!-- 结果列表 -->
            <div id="aiHealLocatorOut" style="margin-top:10px;"></div>
        </div>

        <!-- 失败诊断 Tab -->
        <div class="ai-heal-tab-body" id="aiHealBodyDiag">
            <div class="ai-design-row">
                <label for="aiHealDiagText">错误日志 / 堆栈 / 步骤摘要</label>
                <textarea id="aiHealDiagText" class="ai-design-control" rows="5" placeholder="粘贴运行失败信息…"></textarea>
            </div>
            <div class="ai-design-actions">
                <button type="button" class="ai-glow-btn" id="aiHealDiagBtn">生成诊断建议</button>
            </div>
            <!-- 思维链 -->
            <div id="aiHealDiagThinking" class="ai-thinking-chain" style="display:none;margin-top:16px;">
                <div class="ai-thinking-chain__title"><span class="ai-thinking-chain__pulse"></span>AI 正在诊断</div>
                <div id="aiHealDiagThinkingInner"></div>
            </div>
            <!-- 诊断结果 -->
            <div id="aiHealDiagSummary" class="ai-task-summary" style="display:none;margin-top:16px;"></div>
            <pre id="aiHealDiagOut" class="ai-design-pre" style="margin-top:10px;display:none;"></pre>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/ai_heal.js') }}?v=3"></script>
{% endblock %}
