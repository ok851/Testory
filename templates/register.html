{% extends "auth_shell.html" %}
{% block title %}注册 · {{ product_name }}{% endblock %}

{% block auth_content %}
<div class="testory-auth-card">
    <div class="testory-auth-card-header">
        <img src="{{ url_for('static', filename='brand/testory-mark.svg') }}" alt="{{ product_name }}" width="56" height="56" style="margin:0 auto">
        <h1>注册 {{ product_name }}</h1>
        <p class="sub">创建您的账号，开始自动化测试</p>
    </div>
    <div class="testory-auth-card-body">
        <div id="errorMsg" class="testory-auth-error">
            <span id="errorText"></span>
        </div>
        <div id="successMsg" class="testory-auth-error" style="background:rgba(34,197,94,0.12);border-color:rgba(34,197,94,0.35);color:#86efac;display:none;">
            <span id="successText"></span>
        </div>

        <!-- SMTP 配置区 -->
        <div style="background:var(--bg-elevated,rgba(255,255,255,0.04));border-radius:8px;padding:1rem;margin-bottom:1.25rem;">
            <p style="margin:0 0 0.75rem;font-size:0.82rem;color:#94a3b8;">邮件发送配置（用于接收验证码）</p>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:0.75rem;">
                <button type="button" class="smtp-preset-btn" data-preset="qq" style="padding:4px 12px;border:1px solid var(--border,rgba(255,255,255,0.1));border-radius:6px;background:transparent;color:#a5b4fc;cursor:pointer;font-size:0.78rem;">QQ邮箱</button>
                <button type="button" class="smtp-preset-btn" data-preset="163" style="padding:4px 12px;border:1px solid var(--border,rgba(255,255,255,0.1));border-radius:6px;background:transparent;color:#a5b4fc;cursor:pointer;font-size:0.78rem;">163邮箱</button>
                <button type="button" class="smtp-preset-btn" data-preset="gmail" style="padding:4px 12px;border:1px solid var(--border,rgba(255,255,255,0.1));border-radius:6px;background:transparent;color:#a5b4fc;cursor:pointer;font-size:0.78rem;">Gmail</button>
                <button type="button" class="smtp-preset-btn" data-preset="outlook" style="padding:4px 12px;border:1px solid var(--border,rgba(255,255,255,0.1));border-radius:6px;background:transparent;color:#a5b4fc;cursor:pointer;font-size:0.78rem;">Outlook</button>
                <button type="button" class="smtp-preset-btn" data-preset="custom" style="padding:4px 12px;border:1px solid var(--border,rgba(255,255,255,0.1));border-radius:6px;background:transparent;color:#94a3b8;cursor:pointer;font-size:0.78rem;">自定义</button>
            </div>
            <div style="display:flex;gap:8px;margin-bottom:8px;">
                <input type="text" id="smtpHost" placeholder="SMTP服务器" readonly style="flex:1;padding:8px 10px;background:rgba(255,255,255,0.04);border:1px solid var(--border,rgba(255,255,255,0.1));border-radius:6px;color:var(--text,rgba(255,255,255,0.8));font-size:0.82rem;flex:3;">
                <input type="number" id="smtpPort" placeholder="端口" value="587" readonly style="width:80px;padding:8px 10px;background:rgba(255,255,255,0.04);border:1px solid var(--border,rgba(255,255,255,0.1));border-radius:6px;color:var(--text,rgba(255,255,255,0.8));font-size:0.82rem;">
            </div>
            <input type="email" id="smtpEmail" placeholder="邮箱地址" style="width:100%;padding:8px 10px;margin-bottom:8px;background:rgba(255,255,255,0.04);border:1px solid var(--border,rgba(255,255,255,0.1));border-radius:6px;color:var(--text,rgba(255,255,255,0.8));font-size:0.82rem;box-sizing:border-box;">
            <div style="display:flex;gap:8px;">
                <input type="password" id="smtpPassword" placeholder="SMTP授权码（非登录密码）" style="flex:1;padding:8px 10px;background:rgba(255,255,255,0.04);border:1px solid var(--border,rgba(255,255,255,0.1));border-radius:6px;color:var(--text,rgba(255,255,255,0.8));font-size:0.82rem;">
                <button type="button" id="smtpTestBtn" style="padding:8px 14px;background:rgba(165,180,252,0.15);border:1px solid rgba(165,180,252,0.3);border-radius:6px;color:#a5b4fc;cursor:pointer;font-size:0.78rem;white-space:nowrap;">测试发送</button>
            </div>
            <p id="smtpTestResult" style="margin:6px 0 0;font-size:0.75rem;display:none;"></p>
            <p style="margin:8px 0 0;font-size:0.7rem;color:#64748b;">
                <a href="https://service.mail.qq.com/detail/0/75" target="_blank" style="color:#a5b4fc;">QQ邮箱如何获取授权码？</a>
                &nbsp;|&nbsp;
                <a href="https://help.mail.163.com/faqDetail.do?code=d7a5dc8471cd0c0e8b4b8f4f8e49998b374173cfe9171305fa1ce630d7f67ac2f6034c393646ad9b" target="_blank" style="color:#a5b4fc;">163邮箱如何获取授权码？</a>
            </p>
        </div>

        <!-- 注册表单 -->
        <form id="registerForm">
            <div class="testory-field" style="margin-bottom:0.75rem">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required placeholder="2-64个字符" autocomplete="username">
            </div>
            <div class="testory-field" style="margin-bottom:0.75rem">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required placeholder="至少6位" autocomplete="new-password">
            </div>
            <div class="testory-field" style="margin-bottom:0.75rem">
                <label for="confirmPassword">确认密码</label>
                <input type="password" id="confirmPassword" name="confirm_password" required placeholder="再次输入密码" autocomplete="new-password">
            </div>
            <div style="display:flex;gap:8px;margin-bottom:1rem;">
                <button type="button" id="sendCodeBtn" class="testory-btn-primary" style="flex:2;background:rgba(165,180,252,0.15);color:#a5b4fc;border-color:rgba(165,180,252,0.3);">
                    发送验证码
                </button>
                <div style="flex:1;display:flex;align-items:center;">
                    <input type="text" id="verifyCode" placeholder="6位验证码" maxlength="6" style="width:100%;padding:10px;background:rgba(255,255,255,0.04);border:1px solid var(--border,rgba(255,255,255,0.1));border-radius:8px;color:var(--text,rgba(255,255,255,0.8));font-size:0.9rem;text-align:center;box-sizing:border-box;">
                </div>
            </div>
            <button type="submit" id="submitBtn" class="testory-btn-primary">
                <span id="btnText">注 册</span>
            </button>
        </form>
        <p style="margin-top:1.25rem;text-align:center;font-size:0.8rem;color:#64748b">
            已有账号？<a href="/login" style="color:#a5b4fc;text-decoration:none;font-weight:500;">立即登录</a>
        </p>
    </div>
</div>
{% endblock %}

{% block auth_scripts %}
<script>
(function() {
    var SMTP_PRESETS = {
        qq:     { host: 'smtp.qq.com',       port: 587, use_tls: 1 },
        '163':  { host: 'smtp.163.com',      port: 465, use_tls: 1 },
        gmail:  { host: 'smtp.gmail.com',    port: 587, use_tls: 1 },
        outlook:{ host: 'smtp.office365.com',port: 587, use_tls: 1 },
        custom: { host: '', port: 587, use_tls: 1 }
    };

    var activePreset = 'qq';

    function applyPreset(name) {
        var p = SMTP_PRESETS[name] || SMTP_PRESETS['custom'];
        activePreset = name;
        document.getElementById('smtpHost').value = p.host;
        document.getElementById('smtpHost').readOnly = (name !== 'custom');
        document.getElementById('smtpPort').value = p.port;
        document.getElementById('smtpPort').readOnly = (name !== 'custom');

        var btns = document.querySelectorAll('.smtp-preset-btn');
        btns.forEach(function(b) {
            b.style.borderColor = 'var(--border,rgba(255,255,255,0.1))';
            b.style.background = 'transparent';
            b.style.color = '#94a3b8';
        });
        var active = document.querySelector('.smtp-preset-btn[data-preset="' + name + '"]');
        if (active) { active.style.borderColor = '#a5b4fc'; active.style.background = 'rgba(165,180,252,0.12)'; active.style.color = '#a5b4fc'; }
    }

    document.querySelectorAll('.smtp-preset-btn').forEach(function(btn) {
        btn.addEventListener('click', function() { applyPreset(this.dataset.preset); });
    });
    applyPreset('qq');

    function showError(msg) {
        var el = document.getElementById('errorMsg');
        document.getElementById('errorText').textContent = msg;
        el.classList.add('show');
        document.getElementById('successMsg').style.display = 'none';
    }

    function showSuccess(msg) {
        var el = document.getElementById('successMsg');
        document.getElementById('successText').textContent = msg;
        el.style.display = 'block';
        document.getElementById('errorMsg').classList.remove('show');
    }

    function getSmtpConfig() {
        return {
            host: document.getElementById('smtpHost').value.trim(),
            port: parseInt(document.getElementById('smtpPort').value) || 587,
            username: document.getElementById('smtpEmail').value.trim(),
            password: document.getElementById('smtpPassword').value.trim(),
            use_tls: activePreset === 'custom' ? 1 : SMTP_PRESETS[activePreset].use_tls,
            to_email: document.getElementById('smtpEmail').value.trim()
        };
    }

    document.getElementById('smtpTestBtn').addEventListener('click', async function() {
        var cfg = getSmtpConfig();
        if (!cfg.host || !cfg.username || !cfg.password || !cfg.to_email) {
            showError('请填写完整的 SMTP 配置和邮箱地址');
            return;
        }
        var btn = document.getElementById('smtpTestBtn');
        var resultEl = document.getElementById('smtpTestResult');
        btn.disabled = true;
        btn.textContent = '发送中…';
        resultEl.style.display = 'none';
        try {
            var res = await fetch('/api/auth/smtp-test', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(cfg)
            });
            var data = await res.json();
            if (data.success) {
                resultEl.style.color = '#86efac';
                resultEl.textContent = '测试邮件已发送，请查收';
            } else {
                resultEl.style.color = '#fca5a5';
                resultEl.textContent = data.message || '发送失败';
            }
            resultEl.style.display = 'block';
        } catch(e) {
            resultEl.style.color = '#fca5a5';
            resultEl.textContent = '网络错误';
            resultEl.style.display = 'block';
        }
        btn.disabled = false;
        btn.textContent = '测试发送';
    });

    var codeSent = false;

    document.getElementById('sendCodeBtn').addEventListener('click', async function() {
        var cfg = getSmtpConfig();
        var username = document.getElementById('username').value.trim();
        var email = cfg.to_email;
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirmPassword').value;

        if (!cfg.host || !cfg.username || !cfg.password || !email) {
            showError('请先填写 SMTP 配置');
            return;
        }

        var btn = document.getElementById('sendCodeBtn');
        btn.disabled = true;
        btn.textContent = '发送中…';
        document.getElementById('errorMsg').classList.remove('show');
        document.getElementById('successMsg').style.display = 'none';

        try {
            var res = await fetch('/api/auth/register/send-code', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: username,
                    email: email,
                    password: password,
                    confirm_password: confirmPassword,
                    smtp_host: cfg.host,
                    smtp_port: cfg.port,
                    smtp_username: cfg.username,
                    smtp_password: cfg.password,
                    smtp_use_tls: cfg.use_tls
                })
            });
            var data = await res.json();
            if (data.success) {
                showSuccess('验证码已发送到 ' + email);
                codeSent = true;
                btn.textContent = '重新发送';
                document.getElementById('verifyCode').focus();
            } else {
                showError(data.error || data.message || '发送失败');
                btn.textContent = '发送验证码';
            }
        } catch(e) {
            showError('网络错误');
            btn.textContent = '发送验证码';
        }
        btn.disabled = false;
    });

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var cfg = getSmtpConfig();
        var username = document.getElementById('username').value.trim();
        var email = cfg.to_email;
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirmPassword').value;
        var code = document.getElementById('verifyCode').value.trim();

        if (!code) { showError('请输入验证码'); return; }
        if (!codeSent) { showError('请先发送验证码'); return; }

        var btn = document.getElementById('submitBtn');
        var btnText = document.getElementById('btnText');
        btn.disabled = true;
        btnText.textContent = '注册中…';
        document.getElementById('errorMsg').classList.remove('show');

        try {
            var res = await fetch('/api/auth/register/confirm', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: username,
                    email: email,
                    password: password,
                    code: code,
                    smtp_host: cfg.host,
                    smtp_port: cfg.port,
                    smtp_username: cfg.username,
                    smtp_password: cfg.password,
                    smtp_use_tls: cfg.use_tls
                })
            });
            var data = await res.json();
            if (data.success) {
                localStorage.setItem('currentUser', JSON.stringify(data.user));
                window.location.href = '/';
            } else {
                showError(data.error || data.message || '注册失败');
                btn.disabled = false;
                btnText.textContent = '注 册';
            }
        } catch(e) {
            showError('网络错误');
            btn.disabled = false;
            btnText.textContent = '注 册';
        }
    });

    document.getElementById('confirmPassword').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') document.getElementById('registerForm').dispatchEvent(new Event('submit'));
    });
})();
</script>
{% endblock %}
