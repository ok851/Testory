{% extends "auth_shell.html" %}
{% block title %}注册 · {{ product_name }}{% endblock %}

{% block auth_content %}
<div class="testory-auth-card">
    <div class="testory-auth-card-header">
        <img src="{{ url_for('static', filename='brand/testory-mark.svg') }}" alt="{{ product_name }}" width="56" height="56" style="margin:0 auto">
        <h1>注册 {{ product_name }}</h1>
        <p class="sub">创建本机账号，开始使用</p>
    </div>
    <div class="testory-auth-card-body">
        <div id="errorMsg" class="testory-auth-error">
            <span id="errorText"></span>
        </div>

        <div id="registerPanel">
            <form id="registerForm">
                <div class="testory-field" style="margin-bottom:0.75rem">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required placeholder="2-64个字符" autocomplete="username">
                </div>
                <div class="testory-field" style="margin-bottom:0.75rem">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required placeholder="至少6位" autocomplete="new-password">
                </div>
                <div class="testory-field" style="margin-bottom:1rem">
                    <label for="confirmPassword">确认密码</label>
                    <input type="password" id="confirmPassword" name="confirm_password" required placeholder="再次输入密码" autocomplete="new-password">
                </div>
                <button type="submit" id="submitBtn" class="testory-btn-primary">
                    <span id="btnText">立即注册</span>
                </button>
            </form>
            <p style="margin-top:0.85rem;font-size:0.75rem;color:#64748b;line-height:1.5;">
                注册成功后会生成<strong style="color:#a5b4fc;">找回密钥</strong>（仅显示一次），请自行保存。忘记密码时用它重置。
            </p>
        </div>

        <div id="recoveryPanel" style="display:none;">
            <div style="background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.35);border-radius:8px;padding:1rem;margin-bottom:1rem;">
                <p style="margin:0 0 0.5rem;color:#86efac;font-weight:600;">注册成功</p>
                <p style="margin:0;font-size:0.82rem;color:#cbd5e1;line-height:1.5;">请立即复制并妥善保存找回密钥。丢失后将无法自助重置密码。</p>
            </div>
            <div class="testory-field" style="margin-bottom:0.75rem">
                <label for="recoveryKeyOut">找回密钥</label>
                <input type="text" id="recoveryKeyOut" readonly style="font-family:ui-monospace,Consolas,monospace;letter-spacing:0.04em;">
            </div>
            <button type="button" id="copyKeyBtn" class="testory-btn-primary" style="margin-bottom:0.75rem;">复制找回密钥</button>
            <button type="button" id="goHomeBtn" class="testory-btn-primary" style="background:rgba(165,180,252,0.15);color:#a5b4fc;border-color:rgba(165,180,252,0.3);">进入软件</button>
        </div>

        <p style="margin-top:1.25rem;text-align:center;font-size:0.8rem;color:#64748b">
            已有账号？<a href="/login" style="color:#a5b4fc;text-decoration:none;font-weight:500;">立即登录</a>
        </p>
    </div>
</div>
{% endblock %}

{% block auth_scripts %}
<script>
(function () {
    function showError(msg) {
        document.getElementById('errorText').textContent = msg;
        document.getElementById('errorMsg').classList.add('show');
    }

    document.getElementById('registerForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirmPassword').value;
        var btn = document.getElementById('submitBtn');
        var btnText = document.getElementById('btnText');
        document.getElementById('errorMsg').classList.remove('show');

        if (password !== confirmPassword) {
            showError('两次输入的密码不一致');
            return;
        }

        btn.disabled = true;
        btnText.textContent = '注册中…';
        try {
            var res = await fetch('/api/auth/register/local', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: username,
                    password: password,
                    confirm_password: confirmPassword
                })
            });
            var data = await res.json();
            if (!data.success) {
                showError(data.error || '注册失败');
                btn.disabled = false;
                btnText.textContent = '立即注册';
                return;
            }
            document.getElementById('registerPanel').style.display = 'none';
            document.getElementById('recoveryPanel').style.display = 'block';
            document.getElementById('recoveryKeyOut').value = data.recovery_key || '';
        } catch (err) {
            showError('网络错误，请重试');
            btn.disabled = false;
            btnText.textContent = '立即注册';
        }
    });

    document.getElementById('copyKeyBtn').addEventListener('click', async function () {
        var key = document.getElementById('recoveryKeyOut').value;
        try {
            await navigator.clipboard.writeText(key);
            this.textContent = '已复制';
        } catch (e) {
            document.getElementById('recoveryKeyOut').select();
            document.execCommand('copy');
            this.textContent = '已复制';
        }
    });

    document.getElementById('goHomeBtn').addEventListener('click', function () {
        window.location.href = '/';
    });
})();
</script>
{% endblock %}
