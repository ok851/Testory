<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · Testory 后台管理</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="page-login">
<div class="login-wrap">
    <div class="login-brand">
        <div class="logo">T</div>
        <h1>Testory 后台管理</h1>
        <p>License 签发 · 安装包发布 · 订单与运营数据</p>
    </div>
    <div class="login-card">
        <h2>登录您的账号</h2>
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('login_page') }}">
            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="username">用户名</label>
                <input id="username" name="username" type="text" autocomplete="username" required placeholder="请输入用户名">
            </div>
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label for="password">密码</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="请输入密码">
            </div>
            <button type="submit" class="btn btn-primary btn-block">登录</button>
        </form>
    </div>
</div>
</body>
</html>
